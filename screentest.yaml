  - url: "https://google.com/dummy.png"
    id: radar4
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: id(radar_flag) = 6;
    on_error: 
      then:
        - lambda: ++id(radar_errors);
 
  - url: "https://google.com/dummy.png"
    id: radar5
    format: png
    type: RGB565
    transparency: alpha_channel
