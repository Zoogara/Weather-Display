ota:
  - platform: esphome
    password: "8f03e50909721af0db102dcd689f88ea"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Screentest Fallback Hotspot"
    password: "hyYhqfhSOlkd"

esphome:
  name: screentest
  platformio_options:
    build_unflags: -Werror=all
    board_build.flash_mode: dio
    build_flags: "-DBOARD_HAS_PSRAM" # Added
    board_build.esp-idf.memory_type: qio_opi #Added
    board_upload.maximum_ram_size: 524288 #Added
    board_build.flash_size: 8MB #Added
    
logger:
  level: ERROR

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus

psram:
  mode: octal
  speed: 80MHz

ch422g:
  - id: io_ex

# i2c connections
i2c:
  sda: 8
  scl: 9
  frequency: 400kHz
  scan: true
  id: bus_a

switch:
  - platform: gpio
    name: screentest backlight
    pin: 
      ch422g: io_ex
      number: 2
    restore_mode: ALWAYS_ON
    id: backlight

  - platform: restart
    name: "Weather Screen Restart"
    id: restart_switch

binary_sensor:

  - platform: gpio
    id: presence_sensor
    pin: GPIO06
    name: weather Screen Presence
    device_class: presence
    on_state: 
      then:
        - if: 
            condition: 
              - binary_sensor.is_on: presence_sensor
              - lvgl.is_paused
            then:
              - logger.log: "LVGL resuming"
              - lvgl.resume:
              - lvgl.widget.redraw:
              - switch.turn_on: backlight
              - script.execute: script_obs
              - script.execute: script_hours
              - script.execute: script_days
        - if:
            condition:
              - binary_sensor.is_off: presence_sensor
              - lvgl.is_idle:
                  timeout: 5s
            then: 
              - logger.log: "LVGL is idle"
              - switch.turn_off: backlight
              - lvgl.pause:
                  show_snow: true

touchscreen:
  platform: gt911
  address: 0x5D
  id: my_touchscreen
  update_interval: 16ms
  interrupt_pin: 4
  reset_pin:
    ch422g: io_ex
    number: 1
  on_touch:
    - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );
    - if:
        condition: lvgl.is_paused
        then:
          - logger.log: "LVGL resuming"
          - lvgl.resume:
          - lvgl.widget.redraw:
          - switch.turn_on: backlight
          - script.execute: script_obs
          - script.execute: script_hours
          - script.execute: script_days
display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: io_ex
      number: 3
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1         #r3.
        - 2         #r4.
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3.
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7\

time:
  - platform: homeassistant
    id: my_time
    on_time_sync:
      # start clock
      then:
        - lvgl.label.update:
            id: lbl_datetime
            text: 
              time_format: "%H:%M - %a %d %b"
              time: my_time 
    on_time:
      # update clock
      - seconds: /5
        then: 
          - lvgl.label.update:
              id: lbl_datetime
              text: 
                time_format: "%H:%M - %a %d %b"
                time: my_time
      # download radar - using timer means script doesn't block
      - seconds: /12
        then:
          - if:
              condition:
                and:
                  - lambda: return id(radar_flag) > 0;
                  - not:
                      script.is_running: script_radar_download
              then:
                - script.execute: script_radar_download
      # update observation labels
      - seconds: 0
        minutes: /1
        then: 
          - script.execute: script_obs
      # update hourly forecast data and initialise radar downloads
      - seconds: 0
        minutes: 1, 11, 21, 31, 41, 51
        then: 
          - script.execute: script_hours
          - if:
              condition:
                - lambda: return id(radar_flag) == 0;
              then: 
                - lambda: id(radar_flag) = 1;
                - script.execute: script_radar_download
          - lambda: id(satellite_flag) = 1;
          - script.execute: script_satellite_download
      # update daily forecast 
      - seconds: 0
        minutes: /20
        then: 
          - script.execute: script_days

