text_sensor:
  # debug sensors
  - platform: wifi_info
    ip_address:
      id: esp_ip_address
    ssid:
      id: esp_connected_ssid
    mac_address:
      id: esp_mac_address
    dns_address:
      id: esp_dns_address
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true

  # weather sensors
  # Ecowitt weather station outside temp
  - platform: homeassistant
    entity_id: sensor.weather_station_temperature
    id: temp
  # Ecowitt wind direction - this is one of the few sensors that updates on value
  # as it is fairly dynamic.  The code updates the array with values then updates the wind compass and 
  # displayed values
  - platform: homeassistant
    entity_id: sensor.wind_direction
    id: wind_dir
    on_value: 
      # note we do these loops in ! lambda as using yaml loops for more that 10 repeats
      # causes crashes / buffer overflows
      then:
        # update array used for compas / wind stick
        - lambda: |-
            static int index=0;
            static int prev_index=29;
            // Convert wind direction to int, speed to float
            id(dir) = atoi(id(wind_dir).state.c_str());
            float speed = atof(id(wind_speed).state.c_str());
            // Store in array
            if ((id(hist_wind)[prev_index]!=speed || id(hist_dir)[prev_index]!=id(dir)) && speed!=0) {
              id(hist_wind)[index] = speed;
              id(hist_dir)[index] = id(dir);
              index += 1;
              prev_index += 1;
              if (index==30) { index = 0; }
              if (prev_index==30) { prev_index = 0; }
            }
            // Trend maximum for last 30
            id(maxwind) = id(hist_wind)[0];
            for (size_t i = 0; i < 30; ++i) {
              if (id(hist_wind)[i] > id(maxwind)) {
                id(maxwind) = id(hist_wind)[i];
              }
            }
        # calculate coordinates for wind direction indicator - this is drawn in the wind speed sensor
        - lvgl.widget.update:
            id: dir_indicator
            x: !lambda |-
              return  90 + 50 - 6 + (89 * (cos((id(dir)-90)*PI/180)));
            y: !lambda |-
              return  90 + 140 - 6 + (89 * (sin((id(dir)-90)*PI/180)));
        # clear canvas for wind sticks
        - lvgl.canvas.fill:
            id: wind_stick
            color: BLACK
        # Draw wind stick - again can use yaml loops becase they don't work.  Use c++ LVGL code
        # for drawing
        - lambda: |-
            lv_draw_line_dsc_t line_dsc;
            lv_draw_line_dsc_init(&line_dsc);
            line_dsc.width = 1;
            line_dsc.color = lv_palette_lighten(LV_PALETTE_GREEN, 3);
            line_dsc.opa = LV_OPA_COVER;
            line_dsc.round_start = 0;
            line_dsc.round_end = 0;      
            // loop through array to draw direction / force lines for last 30 readings
            for (int ax = 0; ax < 30; ++ax)  {
              int x1 = 90 + (90 * (cos((id(hist_dir)[ax]-90)*PI/180)));
              int y1 = 90 + (90 * (sin((id(hist_dir)[ax]-90)*PI/180)));
              int x2 = 90 + ((90-(70*id(hist_wind)[ax]/id(maxwind))) * (cos((id(hist_dir)[ax]-90)*PI/180)));
              int y2 = 90 + ((90-(70*id(hist_wind)[ax]/id(maxwind))) * (sin((id(hist_dir)[ax]-90)*PI/180)));
              lv_point_t line_points[2] = {
                { static_cast<lv_coord_t>(x1), static_cast<lv_coord_t>(y1) },
                { static_cast<lv_coord_t>(x2), static_cast<lv_coord_t>(y2) }
              };
              lv_canvas_draw_line(wind_stick, line_points, 2, &line_dsc);
            }

  # Wind speed from Ecowitt,.
  - platform: homeassistant
    entity_id: sensor.wind_speed
    id: wind_speed
    on_value: 
      then:
        # draw indicator for wind compass, colour based on wind speed
        - lvgl.widget.update:
            id: dir_indicator
            arc_color: !lambda |-
              float speed = atof(x.c_str());
              if (speed<=11) return lv_palette_lighten(LV_PALETTE_BLUE, 3); 
              if (speed>11 && speed<=30) return lv_palette_main(LV_PALETTE_GREEN); 
              if (speed>30 && speed<=60) return lv_palette_main(LV_PALETTE_ORANGE); 
              return lv_palette_main(LV_PALETTE_RED); 
        # Update wind speed value - formatting changes depending on how many leading digits
        - if:
            condition:
              lambda: |-
                return (atof(x.c_str())<10);
            then:
              - lvgl.label.update:
                  id: speed_text
                  text: 
                    format: "%.1f"
                    args: [atof(x.c_str())]
            else:
              - lvgl.label.update:
                  id: speed_text
                  text: 
                    format: "%.0f"
                    args: [atof(x.c_str())]

  # named wind direction from Ecowoitt
  - platform: homeassistant
    entity_id: sensor.named_wind_direction
    id: named_dir
    on_value:
      # we chose this sensor to perform first update scripts - no particular reasoning why this one chosen
      then: 
        - if:
            condition:
              lambda: return id(first_run);
            then: 
              - component.update: templot 
              - script.execute: script_obs
              - script.execute: script_hours
              - script.execute: script_days
              - script.execute: script_radar_download
              - lambda: id(satellite_flag) = 1;
              - script.execute: script_satellite_download
              - lambda: id(first_run) = false;
        - lvgl.label.update:
            id: dir_text
            text: !lambda return x;

