# System parameters inc network, hardware and api

esphome:
  name: screentest
  platformio_options:
    build_unflags: -Werror=all
    board_build.flash_mode: dio
    build_flags: "-DBOARD_HAS_PSRAM" 
    board_build.esp-idf.memory_type: qio_opi 
    board_upload.maximum_ram_size: 524288 
    board_build.flash_size: 8MB 

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y

psram:
  mode: octal
  speed: 80MHz

ch422g:
  - id: io_ex

i2c:
  sda: 8
  scl: 9
  frequency: 400kHz
  scan: true
  id: bus_a

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Screentest Fallback Hotspot"
    password: "hyYhqfhSOlkd"

ota:
  - platform: esphome
    password: "8f03e50909721af0db102dcd689f88ea"

logger:
  level: ERROR

# API connect / disconnect toggles status icon on heading bar
api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
          - lambda: |-
              id(api_connect_time) = id(my_time).now();
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus

switch:
  # Backlight on I/O extender - no PWM so on/off only
  - platform: gpio
    name: "Backlight"
    pin: 
      ch422g: io_ex
      number: 2
    restore_mode: ALWAYS_ON
    id: backlight

  # Restart switch - used on status screen
  - platform: restart
    name: "Weather Screen Restart"
    id: restart_switch

  # LVGL switch used to toggle returning to home page on screen wake
  - platform: lvgl
    widget: home_on_wake
    id: sw_home_on_wake
    restore_mode: RESTORE_DEFAULT_OFF

  # Toggles presence sensor and touch to wake OR just touch
  - platform: lvgl
    widget: wake_on_presence
    id: sw_wake_on_presence
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:

  # LD2410 presence sensor - only using state pin, tuned previous on test hardware
  - platform: gpio
    id: presence_sensor
    pin: GPIO06
    name: weather Screen Presence
    device_class: presence
    on_state: 
      # Turn on screen if not already on if presnce is detected
      # otherwise turn off screen if presnce no longer detected and no interaction in last 5 seconds
      then:
        - if: 
            condition: 
              - binary_sensor.is_on: presence_sensor
              - switch.is_on: sw_wake_on_presence
              - lvgl.is_paused
            then:
              - logger.log: "LVGL resuming"
              - lvgl.resume:
              - lvgl.widget.redraw:
              - if:
                  condition:
                    - switch.is_on: sw_home_on_wake
                  then:
                    - lvgl.page.show: weather_page                    
              - switch.turn_on: backlight
              - script.execute: script_obs
              - script.execute: script_hours
              - script.execute: script_days
        - if:
            condition:
              - binary_sensor.is_off: presence_sensor
              - lvgl.is_idle:
                  timeout: 5s
            then: 
              - logger.log: "LVGL is idle"
              - switch.turn_off: backlight
              - lvgl.pause:
                  show_snow: true

# Touchscreen parameters as per other ESPHome projects using this hardware
touchscreen:
  platform: gt911
  address: 0x5D
  id: my_touchscreen
  update_interval: 16ms
  interrupt_pin: 4
  reset_pin:
    ch422g: io_ex
    number: 1
  on_touch:
    # On any touch, if screen is OFF, turn on and refresh values
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - if:
                condition:
                  - switch.is_on: sw_home_on_wake
                then:
                  - lvgl.page.show: weather_page
            - switch.turn_on: backlight
            - script.execute: script_obs
            - script.execute: script_hours
            - script.execute: script_days

# Display as per Waveshare docs and other projects
display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: io_ex
      number: 3
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1         #r3.
        - 2         #r4.
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3.
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7\

# Time sourved from Home Assitant
time:
  - platform: homeassistant
    id: my_time
    on_time_sync:
      then:
        # Display clock on title bar
        - lvgl.label.update:
            id: lbl_datetime
            text: 
              time_format: "%H:%M - %a %d %b"
              time: my_time 
        # Set global storing time of first time synch - we will display this as boot time on status page
        - lambda: |-
            if (id(boot_time_flag))
              { id(boot_time) = id(my_time).now();
                id(boot_time_flag) = false;
              }
    on_time:
      # Update clock on title bar, every five seconds is accurate enough.
      - seconds: /5
        then: 
          - lvgl.label.update:
              id: lbl_datetime
              text: 
                time_format: "%H:%M - %a %d %b"
                time: my_time
      # Download radar - using timer means script doesn't block
      # Only run script if flag is set and script not already running
      # This will only run when the on_time: minutes: 1, 11, 21, 31, 41, 51 has run first
      - seconds: /12
        then:
          - if:
              condition:
                and:
                  - lambda: return id(radar_flag) > 0;
                  - not:
                      script.is_running: script_radar_download
              then:
                - script.execute: script_radar_download
      # Update observation labels once a minute
      - seconds: 0
        minutes: /1
        then: 
          - script.execute: script_obs
      # Update hourly forecast data and initialise radar downloads
      # Radar data is updated every ten minutes on 10 minute steps - thus we do ours a minute later
      - seconds: 0
        minutes: 1, 11, 21, 31, 41, 51
        then: 
          - script.execute: script_hours
          - if:
              condition:
                - lambda: return id(radar_flag) == 0;
              then: 
                - lambda: id(radar_flag) = 1;
                - script.execute: script_radar_download
          - lambda: id(satellite_flag) = 1;
          - script.execute: script_satellite_download
      # Update daily forecast every 20 min - this is good enough to keep up with BOM updates
      - seconds: 0
        minutes: /20
        then: 
          - script.execute: script_days

script:
  # update all observation fields - called on wake and every minute
  - id: script_obs
    then: 
      - lvgl.widget.refresh:
          - id: icon_today
          - id: short_today
          - id: feels_like
          - id: atmo_pressure
          - id: current_temp
          - id: sunrise
          - id: sunset
          - id: humidity

  # update hourly forecast fields, every 10 minutes and on wake
  - id: script_hours
    then: 
      - lvgl.widget.refresh:
          - id: hour0_time
          - id: hour0_icon
          - id: hour0_temp
          - id: hour1_time
          - id: hour1_icon
          - id: hour1_temp
          - id: hour2_time
          - id: hour2_icon
          - id: hour2_temp
          - id: hour3_time
          - id: hour3_icon
          - id: hour3_temp
          - id: hour4_time
          - id: hour4_icon
          - id: hour4_temp
          - id: hour5_time
          - id: hour5_icon
          - id: hour5_temp
          - id: hour6_time
          - id: hour6_icon
          - id: hour6_temp
          - id: hour7_time
          - id: hour7_icon
          - id: hour7_temp
          - id: hour8_time
          - id: hour8_icon
          - id: hour8_temp
          - id: hour9_time
          - id: hour9_icon
          - id: hour9_temp
          - id: hour10_time
          - id: hour10_icon
          - id: hour10_temp
          - id: hour11_time
          - id: hour11_icon
          - id: hour11_temp
          - id: hour12_time
          - id: hour12_icon
          - id: hour12_temp
          - id: hour13_time
          - id: hour13_icon
          - id: hour13_temp
          - id: hour14_time
          - id: hour14_icon
          - id: hour14_temp
          - id: hour15_time
          - id: hour15_icon
          - id: hour15_temp
          - id: hour16_time
          - id: hour16_icon
          - id: hour16_temp
          - id: hour17_time
          - id: hour17_icon
          - id: hour17_temp
          - id: hour18_time
          - id: hour18_icon
          - id: hour18_temp
          - id: hour19_time
          - id: hour19_icon
          - id: hour19_temp
          - id: hour20_time
          - id: hour20_icon
          - id: hour20_temp
          - id: hour21_time
          - id: hour21_icon
          - id: hour21_temp
          - id: hour22_time
          - id: hour22_icon
          - id: hour22_temp
          - id: hour23_time
          - id: hour23_icon
          - id: hour23_temp

  # Update daily forecast fields - every 20 minutes and on wake
  - id: script_days
    then: 
      - lvgl.widget.refresh:
          - id: moon_phase_icon
          - id: moonrise
          - id: forecast_text_0
          - id: forecast_icon_0
          - id: forecast_text_1
          - id: forecast_icon_1
          - id: forecast_text_2
          - id: forecast_icon_2
          - id: forecast_text_3
          - id: forecast_icon_3
          - id: forecast_text_4
          - id: forecast_icon_4
          - id: forecast_text_5
          - id: forecast_icon_5
          - id: forecast_text_6
          - id: forecast_icon_6

  # Radar dowload script - note - this script gets run every 10 minutes, and then every 12
  # seconds after that run until all =images are downloaded or too many errors.  This 
  # approach is used because the http_request: engine is VERY resource hungry and crashes can occur
  # if we simply try and download these one after the other.
  - id: script_radar_download
    then: 
      # If we have got to 10 errors or more during download of ALL timeslots
      # then give up and display an error message
      - if:
          condition:
            lambda: return id(radar_errors) >= 10;
          then:
            - lambda: id(radar_dlstat) = "Error";
            - lvgl.widget.refresh:
                id: radar_tds
            - lvgl.widget.hide: lbl_downloading
            - lambda: |-
                id(radar_flag) = 0;
                id(radar_errors) = 0;
      # This block executes only if flag is set to other than zero,
      # the flag represents the url to download from the list of radar image urls.
      # All each section does is update the matching online_image: with the new URL 
      # then exits the scrip.  The online_image object manages the rest of the download.
      - if:
          condition:
            lambda: return id(radar_flag) != 0;
          then:
            - if:
                condition:
                  lambda: return id(radar_flag) == 1;
                then:
                  # turn on downloading icon - to warn users that response may be slow as http_request: blocks
                  - lvgl.widget.show: lbl_downloading
                  # update status text to indicate what image is being downloaded
                  - lambda: id(radar_dlstat) = "url0";
                  # refresh the field that displays the above global
                  - lvgl.widget.refresh:
                      id: radar_tds
                  # update the URL of the online_image: object - this iniates the download
                  - online_image.set_url: 
                      id: radar0
                      url: !lambda return id(radar_url0).state;
                  # nothing more to do here so stop script.  After successful download this block won't run
                  # when script called second, third time etc. but next will.
                  - script.stop: script_radar_download
            # Repeat above for each call of script with updated radar_flag value...
            - if:
                condition:
                  lambda: return id(radar_flag) == 2;
                then:
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "url1";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - online_image.set_url: 
                      id: radar1
                      url: !lambda return id(radar_url1).state;
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 3;
                then:
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "url2";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - online_image.set_url: 
                      id: radar2
                      url: !lambda return id(radar_url2).state;
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 4;
                then:
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "url3";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - online_image.set_url: 
                      id: radar3
                      url: !lambda return id(radar_url3).state;
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 5;
                then:
                  - lambda: id(radar_dlstat) = "url4";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lvgl.widget.show: lbl_downloading
                  - online_image.set_url: 
                      id: radar4
                      url: !lambda return id(radar_url4).state;
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 6;
                then:
                  - lambda: id(radar_dlstat) = "url5";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lvgl.widget.show: lbl_downloading
                  - online_image.set_url: 
                      id: radar5
                      url: !lambda return id(radar_url5).state;  
                  - script.stop: script_radar_download

  # Satellite image download script            
  - id: script_satellite_download
    then: 
      # similar to radar download - check if flag is set then update online_image url
      - if:
          condition:
            lambda: return id(satellite_flag) != 0;
          then:
            - delay: 15s
            - lvgl.widget.show: lbl_downloading
            - online_image.set_url: 
                id: satellite1
                url: !lambda return id(satellite_url).state; 
      # Give up after 4 failures
      - if:
          condition:
            lambda: return id(satellite_errors) >= 4;
          then:
            - lvgl.widget.hide: lbl_downloading
            - lambda: |-
                id(satellite_flag) = 0;
                id(satellite_errors) = 0;

  # Page selection scripts - only here as placeholders in case any processing require on page change
  - id: page_move_prev
    then:
      - lvgl.page.previous:
  - id: page_move_next
    then:
      - lvgl.page.next:

# Sun required for sun elevation sensor used for day/night comparisons
sun:
  latitude: -36.051961
  longitude: 146.458654

# Globals including those used for display and behaviour flags
globals:
  # Array that stores last 30 wind velocity figures for wind compass
  - id: hist_wind
    type: float[30]
  # Array that stores last 30 wind directions for wind compass
  - id: hist_dir
    type: int[30]
  # Wind direction - saved between readings
  - id: dir
    type: int
  # maximum wind in last 30 readings
  - id: maxwind
    type: float
  # used for array lookup for wind compass
  - id: arrayindex
    type: int
  # Flag for first run of device - used to force update of most things EXCEPT radar
  - id: first_run
    type: bool
    initial_value: "true"
  # Flag/counter for downloading radar images
  - id: radar_flag
    type: int
    initial_value: "0"
  # Counter for radar download errors
  - id: radar_errors
    type: int
    initial_value: "0"
  # flag to trigger satellite image download
  - id: satellite_flag
    type: int
    initial_value: "0"
  # Counter for satellite image download errors
  - id: satellite_errors
    type: int
    initial_value: "0"
  # Status tring to indicate radar download state 
  - id: radar_dlstat
    type: std::string
  # Time of boot (first time synch)
  - id: boot_time
    type: esphome::ESPTime
  # Flag used to ensure boot_time only stored on FIRST time synch
  - id: boot_time_flag
    type: bool
    initial_value: "true"
  # Time of last successful API connection
  - id: api_connect_time
    type: esphome::ESPTime
  # Flag for indication if the status pop-up window is displayed
  - id: status_hidden
    type: bool
    initial_value: "true"

# http_request block required for online_image: - note the watchdog timeout needs to longer 
# than the timeout: value - this prevents rebouts when http_request: blocks EVERYTHING ^&%^&%%$!!
http_request:
  timeout: 11s
  watchdog_timeout: 30s

# Online images
online_image: 
  # Temperature plot sourced from a HA history graph using the Puppet add-on
  # from https://github.com/balloob/home-assistant-addons repository
  - url: "http://192.168.0.100:10000/dashboard-cast/1?viewport=220x220&eink=2&invert"
    id: templot
    format: png
    type: RGB565
    # note we simply update this every 10 mins
    update_interval: 10min
    # If it doesn't work - either leave empty or show previous
    on_download_finished:
      then: 
        - delay: 1s
        - lvgl.image.update:
            id: templot_img
            src: templot

  # Radar images - urls are generated by template in HA, then these objects are 
  # updated every 10 minutes by the radar download script.  Once the script is started it runs every 12
  # seconds untill error count exceeded or all images downloaded.  See script for comment on why this approach.
  - url: "https://google.com/dummy.png"
    id: radar0
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      # If the download of this image is successful, change flag so next will be initiated 
      # on next script run
      then: 
        - lambda: id(radar_flag) = 2;
    on_error: 
      # If the download fails, increment error flag.  The radar flag is not update thus
      # the radar download script will attempt this image again on next run
      then:
        - lambda: ++id(radar_errors);

  # do the rest of the images one at a time
  - url: "https://google.com/dummy.png"
    id: radar1
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: id(radar_flag) = 3;
    on_error: 
      then:
        - lambda: ++id(radar_errors);

  - url: "https://google.com/dummy.png"
    id: radar2
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: id(radar_flag) = 4;
    on_error: 
      then:
        - lambda: ++id(radar_errors);

  - url: "https://google.com/dummy.png"
    id: radar3
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: id(radar_flag) = 5;
    on_error: 
      then:
        - lambda: ++id(radar_errors);
  
  - url: "https://google.com/dummy.png"
    id: radar4
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: id(radar_flag) = 6;
    on_error: 
      then:
        - lambda: ++id(radar_errors);
 
  # last image download differs from first 5
  - url: "https://google.com/dummy.png"
    id: radar5
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      # if we are successful on the last, force update on the animimg, hide the downloading icon,
      # reset all flags and counters and update download status text and timestamp of radar images
      then: 
        - lvgl.animimg.update:
            id: radar
            src: [ radar5, radar4, radar3, radar2, radar1, radar0 ]
        - lvgl.animimg.start: radar
        - lvgl.widget.hide: lbl_downloading
        - lambda: |-
            id(radar_dlstat) = "-";
            id(radar_flag) = 0;
            id(radar_errors) = 0;
        - lvgl.widget.refresh:
            id: radar_tds
        - lvgl.widget.refresh: 
            id: radar_ts
    on_error: 
      # error handling is same as other images - update error count then this download 
      # will get tried again on next script run
      then:
        - lambda: ++id(radar_errors);

  # Staellite image - only one file every 10 minutes
  - url: "https://google.com/dummy.png"
    id: satellite1
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      # successful download
      then: 
        # update the image
        - lvgl.image.update:
            id: satellite
            src: satellite1
        # High the dowloading icon
        - lvgl.widget.hide: lbl_downloading
        # reset flags and couters
        - lambda: id(satellite_flag) = 0;
        - lambda: id(satellite_errors) = 0;
        # update the timestamp text
        - lvgl.widget.refresh: 
            id: sat_ts
    on_error: 
      # if download error - stop script, update error counter and restart script
      then:
        - script.stop: script_satellite_download    
        - lambda: ++id(satellite_errors);
        - script.execute: script_satellite_download    

# Static images
image: 
  # Background image for radar
  - file: "map1b.png"
    id: background_map
    type: RGB565
  # foreground overlay for radar - place names and location 
  - file: "map1f.png"
    id: foreground_map
    type: RGB565
    transparency: alpha_channel
  # Background map for statellite image
  - file: "map2.png"
    id: satellite_map
    type: RGB565
    transparency: alpha_channel 
  # foreground overlay for satellite - borders and coastlines
  - file: "map4.png"
    id: base_map
    type: RGB565
    transparency: alpha_channel 

# All sensors sourced from HA - Ecowitt weather station sensors
# BOM weather forecast sensors using custom template sesnors mostly
sensor:
  # wifi
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic" 

  # sun
  - platform: sun
    id: sun_elevation
    type: elevation

  # numeric sensors from BOM
  - platform: homeassistant
    id: bomhumidity
    entity_id: sensor.rutherglen_humidity
  - platform: homeassistant
    id: sunrise_next
    entity_id: sensor.weather_data
    attribute: sunrise
  - platform: homeassistant
    id: sunset_next
    entity_id: sensor.weather_data
    attribute: sunset

  # hourly temp forecast from custom template sensor 
  - platform: homeassistant
    id: hourlytemp_0
    entity_id: sensor.weather_data
    attribute: temperature_0
  - platform: homeassistant
    id: hourlytemp_1
    entity_id: sensor.weather_data
    attribute: temperature_1
  - platform: homeassistant
    id: hourlytemp_2
    entity_id: sensor.weather_data
    attribute: temperature_2
  - platform: homeassistant
    id: hourlytemp_3
    entity_id: sensor.weather_data
    attribute: temperature_3
  - platform: homeassistant
    id: hourlytemp_4
    entity_id: sensor.weather_data
    attribute: temperature_4
  - platform: homeassistant
    id: hourlytemp_5
