# LVGL starts here!
lvgl:
  # idle time only used for timeout on status pop-up.  Main screen timeout handled by
  # presence sensor
  on_idle:
    - timeout: 15s
      # if no interaction after 15 seconds, check to see if pop-up display and hide it if so
      # update flag that lets us know it is shgowing as I see no code to detect if obj is visible or not.
      then:
        if:
          condition:
            - lambda: return id(status_hidden) == false;
          then:
            - lvgl.widget.hide: status
            - lambda: id(status_hidden) = true;

  # Just the one display - at 800 x 480 that is pleny for memory to handle 
  displays:
    - my_display

  # change default checked for buttons - we will use icon state to indicate checked status
  theme:
    button:
      bg_color: 0x2F8CD8
      text_color: WHITE
      checked: 
        bg_color: 0x087bd8
        text_color: YELLOW

  # Style only used for header and foot and forecast text on weather page.  All other pages / etc
  # use explicit styles or defaults
  style_definitions:
    - id: header_footer
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      width: 100%
      height: 32
    - id: forecast_text
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0x000000
      text_font: calibri_13
    - id: forecast_glyph
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0x000000
      text_font: weather_24

  # Top layer holds nav bar and title bar plus hidden settings/status pop-up
  top_layer:
    widgets:
      - obj:
          # Status and settings pop-up - starts hidden 
          id: status
          align: CENTER
          width: 700
          height: 350
          pad_all: 6
          hidden: true
          layout: # enable the GRID layout for the children widgets
            type: GRID # split the rows and the columns proportionally
            pad_row: 6
            pad_column: 8
            grid_columns: [FR(20), FR(30), FR(40), FR(10)]
            grid_rows: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)] 
          # Status information from ESPHome wifi and diagnostic / wifi sensors
          widgets:
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text_decor: UNDERLINE
                text: "Status"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 0
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "IP Address:"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 1
            - label: 
                id: esp_ip
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                text: !lambda return id(esp_ip_address).state;
                pad_top: 6
                grid_cell_column_pos: 1
                grid_cell_row_pos: 1
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "Connected SSID:"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 2
            - label: 
                id: esp_ssid
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                text: !lambda return id(esp_connected_ssid).state;
                pad_top: 6
                grid_cell_column_pos: 1
                grid_cell_row_pos: 2
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "Wifi signal dB:"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 3
            - label: 
                id: esp_wifi_db
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                text: !lambda |-
                        char h[20];
                        snprintf(h, sizeof(h), "%.0f dB", id(wifi_signal_db).state);
                        return h;
                pad_top: 6
                grid_cell_column_pos: 1
                grid_cell_row_pos: 3
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "DNS address:"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 4
            - label: 
                id: esp_dns
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                text: !lambda return id(esp_dns_address).state;
                pad_top: 6
                grid_cell_column_pos: 1
                grid_cell_row_pos: 4
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "MAC Address:"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 5
            - label: 
                id: mac
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                text: !lambda return id(esp_mac_address).state;
                pad_top: 6
                grid_cell_column_pos: 1
                grid_cell_row_pos: 5
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "Boot time:"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 7
            - label: 
                id: lbl_boot_time
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                text: "--"
                pad_top: 6
                grid_cell_column_pos: 1
                grid_cell_row_pos: 7
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "API connect time:"
                pad_top: 6
                grid_cell_column_pos: 0
                grid_cell_row_pos: 8
            - label: 
                id: lbl_api_time
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                text: "--"
                pad_top: 6
                grid_cell_column_pos: 1
                grid_cell_row_pos: 8
            - label:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text_decor: UNDERLINE
                text: "Settings"
                pad_top: 6
                grid_cell_column_pos: 2
                grid_cell_row_pos: 0
            - label:
              # Switch defined above that toggles if weather creen shown on wake or last shown screen
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "Show Home screen on wake:"
                pad_top: 6
                grid_cell_column_pos: 2
                grid_cell_row_pos: 1
            - switch:
                id: home_on_wake
                align: CENTER
                pad_top: 6
                grid_cell_column_pos: 3
                grid_cell_row_pos: 1
            - label:
              # Switch to enable / disable wake on presence sensor.  Touch always wakes.
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "Wake on presence:"
                pad_top: 6
                grid_cell_column_pos: 2
                grid_cell_row_pos: 2
            - switch:
                id: wake_on_presence
                align: CENTER
                pad_top: 6
                grid_cell_column_pos: 3
                grid_cell_row_pos: 2
            - label:
              # button which if clicked triggers sleep mode
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "Press to sleep now:"
                pad_top: 6
                grid_cell_column_pos: 2
                grid_cell_row_pos: 6
            - button:
                id: press_to_sleep
                align: CENTER
                pad_top: 6
                height: 30
                width: 60
                grid_cell_column_pos: 3
                grid_cell_row_pos: 6
                widgets:
                  - label:
                      align: CENTER
                      text: "Sleep"
                on_click:
                  - lvgl.widget.hide: status
                  - lambda: id(status_hidden) = true;                  
                  - delay: 0.5s
                  - switch.turn_off: backlight
                  - lvgl.pause:
                      show_snow: true
            - label:
              # button that if clicked triggers restart via ESPHome restart_switch:
                align: CENTER
                text_align: LEFT
                text_color: BLACK
                text: "Press for restart:"
                pad_top: 6
                grid_cell_column_pos: 2
                grid_cell_row_pos: 8
            - button:
                id: press_to_restart
                align: CENTER
                checkable: TRUE
                pad_top: 6
                height: 30
                width: 60
                grid_cell_column_pos: 3
                grid_cell_row_pos: 8
                widgets:
                  - label:
                      align: CENTER
                      text: "Restart"
                on_change:
                  switch.turn_on: restart_switch

      - obj:
        # Header object - not page title is overwirtten by each page load
          align: TOP_MID
          styles: header_footer
          widgets:
            - label:
                id: pagetitle
                text: "Rutherglen Weather"
                align: CENTER
                text_align: CENTER
                text_color: 0xFFFFFF
                pad_all: 6
            - label:
              # Status icon indicating connection to HA API is established
                text: "\uF1EB"
                id: lbl_hastatus
                hidden: true
                align: top_right
                x: 0
                y: 0
                text_align: right
                text_color: 0xFFFFFF
                pad_all: 6
            - label:
              # Status icon shown only when satellite and radar images are downloading
                text: "\uF019"
                id: lbl_downloading
                hidden: true
                align: top_right
                x: -40
                y: 1
                width: 15
                text_align: left
                text_color: RED
                pad_all: 6
            - label:
              # date and time 
                id: lbl_datetime
                align: top_left
                x: 0
                y: 0
                text_align: left
                text_color: 0xFFFFFF
                pad_all: 6    
                on_press:
                  then: 
                    # date & time label is a "hidden" button to display the status and settings pop-up
                    - lvgl.widget.show: status
                    # populate the diagnostics as these won't be written at startup
                    - lvgl.widget.refresh: 
                        - id: mac
                        - id: esp_ip
                        - id: esp_ssid
                        - id: esp_wifi_db
                        - id: esp_dns
                    - lvgl.label.update:
                        id: lbl_boot_time
                        text:
                          time_format: "%c"
                          time: !lambda return id(boot_time);
                    - lvgl.label.update:
                        id: lbl_api_time
                        text:
                          time_format: "%c"
                          time: !lambda return id(api_connect_time);
                    - lambda: id(status_hidden) = false;
                on_long_press:
                  then:
                    # Long press will close settings and status pop-up
                    - lvgl.widget.hide: status
                    - lambda: id(status_hidden) = true;

      - buttonmatrix:
        # Footer object - just navigation buttons and home button
          align: bottom_mid
          styles: header_footer
          pad_all: 0
          outline_width: 0
          id: top_layer
          items:
            styles: header_footer
          rows:
            # not that trigger point to script rather than just doing next page action
            # because we originally were going to do other processing
            - buttons:
              - id: page_prev
                text: "\uF053"
                on_press:
                  then:
                    - script.execute: page_move_prev
              - id: page_home
                text: "\uF015"
                on_press:
                  then:
                    - lvgl.page.show: weather_page
              - id: page_next
                text: "\uF054"
                on_press:
                  then:
                    - script.execute: page_move_next
  
  # Page definitions - note that with LVGL page order in yaml is the same as compiled code
  pages:
    # Weather information sourced from Ecowitt and BOM
    - id: weather_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "Rutherglen Weather"
      bg_color: 0x000000
      # Swipe triggers for page navigation - duplicates same as buttons
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  
      widgets:
    # Wind Rose
        # Canvas used for drawing wind history - behind all other objects on this page
        - canvas:
            id: wind_stick
            x: 50
            y: 140
            height: 180
            width: 180
        # Circle used for wind compass
        - arc:
            x: 50
            y: 140
            height: 180
            width: 180
            id: wind_rose
            arc_width: 2
            start_angle: 0
            end_angle: 360
            adjustable: false 
            arc_color: WHITE   
        # "Filled" arc used for pointer for wind compass
        - arc:
            id: dir_indicator
            x: 10
            y: 10
            start_angle: 0
            end_angle: 360
            arc_width: 6
            adjustable: false 
            height: 12
            width: 12
            arc_color: BLUE
        # Cardinal directions labels
        - label:
            x: 50
            y: 110
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "N"
        - label:
            x: 50
            y: 334
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "S"
        - label:
            x: 244
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "E" 
        - label:
            x: 21
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "W"      
        # Label for named wind direction       
        - label:
            id: dir_text
            x: 50
            y: 180
            text_font: calibri_25
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "-"
        # Units label which appers below wind speed
        - label:
            x: 50
            y: 250
            text_font: calibri_19
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "km/h"
        # Wind speed
        - label:
            id: speed_text
            x: 50
            y: 210
            text_font: calibri_40
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "-"

    # Observations
        # Icon for current day weather - top left of display
        - label:
            id: icon_today
