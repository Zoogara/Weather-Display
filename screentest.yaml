    - id: radar_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "Rutherglen Radar"
      bg_color: 0x000000
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  

      widgets:
        - image: 
            id: map1
            x: 90
            y: 110
            src: background_map
        - animimg: 
            id: radar
            x: 90
            y: 110
            src: [ radar5, radar4, radar3, radar2, radar1, radar0 ]
            duration: 6000ms
            auto_start: false
        - image: 
            id: map1f
            x: 90
            y: 110
            src: foreground_map          
        - image:
            id: basemap
            x: 454
            y: 110
            src: base_map
        - image:
            id: satellite
            x: 454
            y: 110
            src: satellite1
        - image: 
            id: map2
            x: 454
            y: 110
            src: satellite_map
        - label:
            x: 90
            y: 90
            text_font: calibri_19
            text_color: WHITE
            text_align: LEFT
            text: "Radar"            
        - label:
            id: radar_ts
            align_to:
              id: map1
              align: OUT_BOTTOM_LEFT
              y: 3
            text_font: calibri_13
            text_color: WHITE
            text_align: RIGHT
            text: !lambda return id(radar_timestamp).state;
        - label:
            id: radar_tds
            align_to:
              id: radar_ts
              align: OUT_BOTTOM_LEFT
              x: 3
            text_font: calibri_13
            text_color: WHITE
            text: !lambda return id(radar_dlstat);
        - label:
            x: 454
            y: 90
            text_font: calibri_19
            text_color: WHITE
            text_align: LEFT
            text: "Satellite"            
        - label:
            id: sat_ts
            align_to:
              id: map2
              align: OUT_BOTTOM_LEFT
              y: 3
            text_font: calibri_13
            text_color: WHITE
            text_align: LEFT
            text: !lambda return id(satellite_timestamp).state;

