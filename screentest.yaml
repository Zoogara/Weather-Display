# System parameters inc network, hardware and api
# note platformio_options and the board definition 
# weree copied directly from a HA forum post - I fixed 
# one error (flash size) but others I copied verbatim

# The config is split into feature packages (see packages/screentest/).  Order matters for the LVGL pages
# (weather, radar, history, lights) because page next / previous follows the order of the list.
packages:
  hardware: !include packages/screentest/hardware.yaml
  core: !include packages/screentest/core.yaml
  weather: !include packages/screentest/weather.yaml
  radar: !include packages/screentest/radar.yaml
  history: !include packages/screentest/history.yaml
  lights: !include packages/screentest/lights.yaml
  settings: !include packages/screentest/settings.yaml
