    # Radar and satellite
    - id: radar_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "Rutherglen Radar"
      bg_color: 0x000000
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  
      # Map images - there is room on this page for more data but at the moment just 2 images
      widgets:
        # background static image matching zoom and location of radar images
        - image: 
            id: map1
            x: 90
            y: 110
            src: background_map
        # middle layer is animimg made up of downloaded radra images, radar5 is oldest, radar0
        # is newest 
        - animimg: 
            id: radar
            x: 90
            y: 110
            src: [ radar5, radar4, radar3, radar2, radar1, radar0 ]
            duration: 6000ms
            auto_start: false
        # Top overlay is major town locations and names
        - image: 
            id: map1f
            x: 90
            y: 110
            src: foreground_map
        # background static map of SE australia - matches satellite zoom and location
        - image:
            id: basemap
            x: 454
            y: 110
            src: base_map
        # middle layer is IR satellite view downloaded from Rainviewer
        - image:
            id: satellite
            x: 454
            y: 110
            src: satellite1
        # top overlay is state borders and coastlines - visible over cloud layers
        - image: 
            id: map2
            x: 454
            y: 110
            src: satellite_map
        # Headings and timestam, status data labels
        - label:
            x: 90
            y: 90
            text_font: calibri_19
            text_color: WHITE
            text_align: LEFT
            text: "Radar"            
        - label:
            id: radar_ts
            align_to:
              id: map1
              align: OUT_BOTTOM_LEFT
              y: 3
            text_font: calibri_13
            text_color: WHITE
            text_align: RIGHT
            text: !lambda return id(radar_timestamp).state;
        - label:
            id: radar_tds
            align_to:
              id: radar_ts
              align: OUT_BOTTOM_LEFT
              x: 3
            text_font: calibri_13
            text_color: WHITE
            text: !lambda return id(radar_dlstat);
        - label:
            x: 454
            y: 90
            text_font: calibri_19
            text_color: WHITE
            text_align: LEFT
            text: "Satellite"            
        - label:
            id: sat_ts
            align_to:
              id: map2
              align: OUT_BOTTOM_LEFT
              y: 3
            text_font: calibri_13
            text_color: WHITE
            text_align: LEFT
            text: !lambda return id(satellite_timestamp).state;

    # Page for light control - some spare buttons
    # yaml is mostly copied drom the LVGL Tips & Tricks page "Toggle state icon button"
    # therfe may be a way of making this less "bulky" - for future date
    - id: lights_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "Rutherglen Lights"
      bg_color: 0x000000
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  

      widgets:
        # grid layout object for all buttons
        - obj: 
            align: CENTER
            width: 800
            height: 400
            pad_all: 6
            bg_opa: TRANSP
            border_opa: TRANSP
            # 4 x 3 grid for buttons - makes them big enough to display both icon and label
            layout: 
              type: GRID 
              pad_row: 6
              pad_column: 8
              grid_columns: [FR(1), FR(1), FR(1), FR(1)]
              grid_rows: [FR(1), FR(1), FR(1)] 
            widgets:
              # buttons - same code for all differe only in icon (group or single) and label
              # plus whatever the code controls
              - button:
                  id: light1
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  widgets:
                    - label:
                        id: icon_light1
                        align: CENTER
                        text_font: mdi_42
                        text: "\U000F0336"
                    - label:
                        id: lbl_light1
                        align_to: 
                          id: icon_light1
                          align: OUT_BOTTOM_MID
                        text: "Office"
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
