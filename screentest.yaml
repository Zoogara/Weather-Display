lvgl:
  displays:
    - my_display
  style_definitions:
    - id: header_footer
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      width: 100%
      height: 32
    - id: forecast_text
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0x000000
      text_font: calibri_13
    - id: forecast_glyph
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0x000000
      text_font: weather_24
  top_layer:
    widgets:
      - obj:
          id: status
          align: CENTER
          width: 700
          height: 350
          pad_all: 6
          hidden: true
          layout: # enable the GRID layout for the children widgets
            type: GRID # split the rows and the columns proportionally
            pad_row: 6
            pad_column: 8
            grid_columns: [FR(90), FR(10)]
            grid_rows: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)] 
          widgets:
            - label:
                id: mac
                align: CENTER
                text_align: CENTER
                text_color: BLACK
                pad_all: 6
                text: !lambda return id(esp_mac_address).state;
                grid_cell_column_pos: 0
                grid_cell_row_pos: 0                
      - obj:
          align: TOP_MID
          styles: header_footer
          widgets:
            - label:
                id: pagetitle
                text: "Rutherglen Weather"
                align: CENTER
                text_align: CENTER
                text_color: 0xFFFFFF
                pad_all: 6
            - label:
                text: "\uF1EB"
                id: lbl_hastatus
                hidden: true
                align: top_right
                x: 0
                y: 0
                text_align: right
                text_color: 0xFFFFFF
                pad_all: 6
            - label:
                text: "\uF019"
                id: lbl_downloading
                hidden: true
                align: top_right
                x: -40
                y: 1
                width: 15
                text_align: left
                text_color: RED
                pad_all: 6
            - label:
                id: lbl_datetime
                align: top_left
                x: 0
                y: 0
                text_align: left
                text_color: 0xFFFFFF
                pad_all: 6    
                on_press:
                  then: 
                    - lvgl.widget.show: status
                    - lvgl.widget.refresh: mac
                on_long_press:
                  lvgl.widget.hide: status
      - buttonmatrix:
          align: bottom_mid
          styles: header_footer
          pad_all: 0
          outline_width: 0
          id: top_layer
          items:
            styles: header_footer
          rows:
            - buttons:
              - id: page_prev
                text: "\uF053"
                on_press:
                  then:
                    - script.execute: page_move_prev
              - id: page_home
                text: "\uF015"
                on_press:
                  then:
                    - lvgl.page.show: weather_page
              - id: page_next
                text: "\uF054"
                on_press:
                  then:
                    - script.execute: page_move_next
  pages:
    - id: weather_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "Rutherglen Weather"
      bg_color: 0x000000
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  
      widgets:
    # Wind Rose
        - canvas:
            id: wind_stick
            x: 50
            y: 140
            height: 180
            width: 180
       
        - arc:
            x: 50
            y: 140
            height: 180
            width: 180
            id: wind_rose
            arc_width: 2
            start_angle: 0
            end_angle: 360
            adjustable: false 
            arc_color: WHITE   
        - arc:
            id: dir_indicator
            x: 10
            y: 10
            start_angle: 0
            end_angle: 360
            arc_width: 6
            adjustable: false 
            height: 12
            width: 12
            arc_color: BLUE
        - label:
            x: 50
            y: 110
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "N"
        - label:
            x: 50
            y: 334
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "S"
        - label:
            x: 244
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "E" 
        - label:
            x: 21
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "W"             
        - label:
            id: dir_text
            x: 50
            y: 180
