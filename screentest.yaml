        # Invisible touch area over the forecast panel - double tap switches the forecast view
        - obj:
            id: forecast_touch
            x: 492
            y: 35
            width: 308
            height: 410
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            # LVGL's own double click timing is fussy, so time two short clicks ourselves: 700 ms window
            on_short_click:
              then:
                - lambda: |-
                    uint32_t now = millis();
                    if (id(forecast_last_tap) != 0 && (now - id(forecast_last_tap)) < 700) {
                      id(forecast_last_tap) = 0;
                      id(forecast_double_tap) = true;
                    } else {
                      id(forecast_last_tap) = now;
                      id(forecast_double_tap) = false;
                    }
                - if:
                    condition:
                      lambda: return id(forecast_double_tap);
                    then:
                      - script.execute: script_forecast_toggle
    
    # Radar and satellite
    - id: radar_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "Rutherglen Radar"
      bg_color: 0x000000
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  
      widgets:
        - label:
            x: 15
            y: 48
            text_font: calibri_19
            text_color: WHITE
            text_align: LEFT
            text: "Radar"            
        - label:
            x: 405
            y: 48
            text_font: calibri_19
            text_color: WHITE
            text_align: LEFT
            text: "Satellite"            
        # Radar: a 380x330 window (plus 1px border) onto the middle of the scaled radar frames
        - obj:
            id: radar_panel
            x: 14
            y: 71
            width: 382
            height: 332
            bg_color: BLACK
            border_width: 1
            border_color: 0xB0B0B0
            radius: 7
            clip_corner: true
            pad_all: 0
            scrollable: false
            widgets:
              # static base map (same size as the window)
              - image: 
                  id: map1
                  x: 0
                  y: 0
                  src: background_map
              # current radar frame (384x384, scaled 4/3 about its centre), positioned so the centre of
              # the frame sits at the centre of the 380x330 window
              - image: 
                  id: radar_img
                  x: -2
                  y: -27
                  pivot_x: 192
                  pivot_y: 192
                  scale: 1.3333
                  src: radar6
        # progress bar under the radar - one step per frame
        - bar:
            id: radar_progress
            x: 15
            y: 404
            width: 380
            height: 6
            radius: 0
            min_value: 0
            max_value: 6
            value: 0
            bg_color: 0x303030
            indicator:
              bg_color: 0x2F8CD8
        # time of the frame being shown, and download status
        - label:
            id: radar_ts
            x: 15
            y: 414
            text_font: calibri_13
            text_color: WHITE
            text_align: LEFT
            text: !lambda return id(radar_ts6).state;
        - label:
            id: radar_tds
            x: 255
            y: 414
            width: 140
            text_font: calibri_13
            text_color: WHITE
            text_align: RIGHT
            text: !lambda return id(radar_dlstat);
        # Satellite: single image, same size as the radar window
        - obj:
            id: sat_panel
            x: 404
            y: 71
            width: 382
            height: 332
            bg_color: BLACK
            border_width: 1
            border_color: 0xB0B0B0
            radius: 7
            clip_corner: true
            pad_all: 0
            scrollable: false
            widgets:
              - image:
                  id: satellite
                  x: 0
                  y: 0
                  src: satellite1
        - label:
            id: sat_ts
            x: 405
            y: 414
            text_font: calibri_13
            text_color: WHITE
            text_align: LEFT
            # sat_time_utc is e.g. 2026-11-14T04:00:00Z - convert to local and show date and time
            text: !lambda |-
              std::string s = id(sat_time_utc).state;
              if (s.size() < 19 || s[4] != '-') return std::string("-");
              esphome::ESPTime u{};
              u.year = atoi(s.substr(0, 4).c_str());
              u.month = atoi(s.substr(5, 2).c_str());
              u.day_of_month = atoi(s.substr(8, 2).c_str());
              u.hour = atoi(s.substr(11, 2).c_str());
              u.minute = atoi(s.substr(14, 2).c_str());
              u.second = atoi(s.substr(17, 2).c_str());
              u.recalc_timestamp_utc(false);
              auto l = esphome::ESPTime::from_epoch_local(u.timestamp);
              int h = l.hour % 12;
              if (h == 0) h = 12;
              char buf[40];
              snprintf(buf, sizeof(buf), "%s %d:%02d %s", l.strftime("%a %d %b").c_str(), h, l.minute, l.hour >= 12 ? "PM" : "AM");
              return std::string(buf);

