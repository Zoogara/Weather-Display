# System parameters inc network, hardware and api
# note platformio_options and the board definition 
# weree copied directly from a HA forum post - I fixed 
# one error (flash size) but others I copied verbatim

esphome:
  name: screentest
  platformio_options:
    build_unflags: -Werror=all
    board_build.flash_mode: dio
    build_flags: "-DBOARD_HAS_PSRAM" 
    board_build.esp-idf.memory_type: qio_opi 
    board_upload.maximum_ram_size: 524288 
    board_build.flash_size: 16MB
  on_boot: 
    then:
      # restore values for start and end time for presence sensor wake
      - lvgl.dropdown.update:
          id: wake_end_time
          selected_index: !lambda return id(presence_end_index);
      - lvgl.dropdown.update:
          id: wake_start_time
          selected_index: !lambda return id(presence_start_index);
      # The screen is normally switched off by the presence sensor changing to OFF.  After a restart the
      # sensor is already OFF and never changes, so the screen would stay on until someone walks past.
      # Once things have settled, do the same check as the presence sensor's "off" branch.
      - delay: 30s
      - if:
          condition:
            - binary_sensor.is_off: presence_sensor
            - lvgl.is_idle:
                timeout: 5s
          then:
            - logger.log: "LVGL is idle (after boot)"
            - switch.turn_off: backlight
            - lvgl.pause:
                show_snow: true

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y

psram:
  mode: octal
  speed: 80MHz

web_server:
  include_internal: True

ch422g:
  - id: io_ex

i2c:
  sda: 8
  scl: 9
  frequency: 400kHz
  scan: true
  id: bus_a

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # mains powered display doing lots of http: light power save can delay or abort TCP connects
  power_save_mode: none

  ap:
    ssid: "Screentest Fallback Hotspot"
    password: !secret weather_ap_password

ota:
  - platform: esphome
    password: !secret weather_ota_password

logger:
  level: DEBUG

# API connect / disconnect toggles status icon on heading bar
api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
          - lambda: |-
              id(api_connect_time) = id(my_time).now();
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus

switch:
  # Backlight on I/O extender - no PWM so on/off only
  # Note there is way to truen on dimming for this panel
  # see example in https://github.com/Zoogara/Calendar-read-only-waveshare-s3-lcd-touch-7
  # for the required hardware changes - I haven't 
  # implemented in ESPHome
  
  - platform: gpio
    name: "Backlight"
    pin: 
      ch422g: io_ex
      number: 2
    restore_mode: ALWAYS_ON
    id: backlight

  # Restart switch - used on status screen
  - platform: restart
    name: "Weather Screen Restart"
    id: restart_switch

  # LVGL switch used to toggle returning to home page on screen wake
  - platform: lvgl
    widget: home_on_wake
    id: sw_home_on_wake
    restore_mode: RESTORE_DEFAULT_OFF

  # Toggles presence sensor and touch to wake OR just touch
  - platform: lvgl
    widget: wake_on_presence
    id: sw_wake_on_presence
    restore_mode: RESTORE_DEFAULT_OFF

  # Toggles timer to turn off prtesence sensor
  - platform: lvgl
    widget: enable_timer
    id: sw_enable_timer
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:

  # LD2410 presence sensor - only using state pin, tuned previous on test hardware
  - platform: gpio
    id: presence_sensor
    pin: GPIO06
    name: weather Screen Presence
    device_class: presence
    on_state: 
      # Turn on screen if not already on if presnce is detected
      # otherwise turn off screen if presnce no longer detected and no interaction in last 5 seconds
      then:
        - if: 
            condition: 
              - binary_sensor.is_on: presence_sensor
              - switch.is_on: sw_wake_on_presence
              - lvgl.is_paused
            then:
              - logger.log: "LVGL resuming"
              - lvgl.resume:
              - lvgl.widget.redraw:
              - if:
                  condition:
                    - switch.is_on: sw_home_on_wake
                  then:
                    - lvgl.page.show: weather_page                    
              - switch.turn_on: backlight
              - script.execute: script_obs
              - script.execute: script_hours
              - script.execute: script_days
        - if:
            condition:
              - binary_sensor.is_off: presence_sensor
              - lvgl.is_idle:
                  timeout: 5s
            then: 
              - logger.log: "LVGL is idle"
              - switch.turn_off: backlight
              - lvgl.pause:
                  show_snow: true

# Touchscreen parameters as per other ESPHome projects using this hardware
touchscreen:
  platform: gt911
  address: 0x5D
  id: my_touchscreen
  update_interval: 16ms
  interrupt_pin: 4
  reset_pin:
    ch422g: io_ex
    number: 1
  on_touch:
    # On any touch, if screen is OFF, turn on and refresh values
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - if:
                condition:
                  - switch.is_on: sw_home_on_wake
                then:
                  - lvgl.page.show: weather_page
            - switch.turn_on: backlight
            - script.execute: script_obs
            - script.execute: script_hours
            - script.execute: script_days

# Display as per Waveshare docs and other projects
display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: io_ex
      number: 3
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1         #r3.
        - 2         #r4.
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3.
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7\

# Time sourced from Home Assitant
time:
  - platform: homeassistant
    id: my_time
    on_time_sync:
      then:
        # Display clock on title bar
        - lvgl.label.update:
            id: lbl_datetime
            text: 
              time_format: "%H:%M - %a %d %b"
              time: my_time 
        # Set global storing time of first time synch - we will display this as boot time on status page
        - lambda: |-
            if (id(boot_time_flag))
              { id(boot_time) = id(my_time).now();
                id(boot_time_flag) = false;
              }
        - logger.log:
            format: "Time now is: %X"
            args: id(my_time).now()
    on_time:
      # Update clock on title bar, every five seconds is accurate enough.
      - seconds: /5
        then: 
          - lvgl.label.update:
              id: lbl_datetime
              text: 
                time_format: "%H:%M - %a %d %b"
                time: my_time
      # Download radar - using timer means script doesn't block (maybe)
      # Only run script if flag is set and script not already running
      # This will only run when the on_time: minutes: 1, 11, 21, 31, 41, 51 has run first
      # i.e. this runs every 2 secs from the time the main script runs until the radar images are all downloaded.
      - seconds: /2
        then:
          - if:
              condition:
                and:
                  - lambda: return id(radar_flag) > 0;
                  - not:
                      script.is_running: script_radar_download
              then:
                - script.execute: script_radar_download
      # Update observation labels once a minute
      - seconds: 0
        minutes: /1
        then: 
          - script.execute: script_obs
      # Update hourly forecast data every ten minutes
      - seconds: 0
        minutes: 1, 11, 21, 31, 41, 51
        then: 
          - script.execute: script_hours
      # Radar updates are NOT started from a clock any more: Home Assistant delivers each new frame 1-2 minutes
      # after its time stamp, and a fixed time kept being a minute too early (so the display showed the previous
      # set for another ten minutes).  The radar update now starts when the newest frame changes (on_value of
      # radar_url1).  This is just a slow safety net in case that event is ever missed.
      - seconds: 0
        minutes: 7, 37
        then:
          - if:
              condition:
                - lambda: return id(radar_flag) == 0 && !id(radar_busy);
              then: 
                - lambda: id(radar_flag) = 1;
      # Himawari-9 infrared is updated every 10 minutes but arrives with a delay, so refresh twice an hour
      - seconds: 0
        minutes: 3, 33
        then:
          - lambda: id(satellite_flag) = 1;
          - script.execute: script_satellite_download
      # Update daily forecast every 20 min - this is good enough to keep up with BOM updates
      - seconds: 0
        minutes: /20
        then: 
          - script.execute: script_days
      # restart each morning at 1:00am
      - hours: 1
        minutes: 0
        seconds: 0
        then:
          - switch.turn_on: restart_switch

datetime:
  - platform: template
    id: presence_end_time
    type: TIME
    optimistic: True
    initial_value: "22:00"
    restore_value: True
    on_time:
      then:
        if:
          condition:
            - switch.is_on: sw_enable_timer
          then:
            - switch.turn_off: sw_wake_on_presence
  - platform: template
    id: presence_start_time
    type: TIME
    optimistic: True
    initial_value: "08:00"
    restore_value: True
    on_time:
      then:
        if:
          condition:
            - switch.is_on: sw_enable_timer
          then:
            - switch.turn_on: sw_wake_on_presence

script:
  # update all observation fields - called on wake and every minute
  - id: script_obs
    then: 
      - lvgl.widget.refresh:
          - id: icon_today
          - id: short_today
          - id: feels_like
          - id: atmo_pressure
          - id: current_temp
          - id: sunrise
          - id: sunset
          - id: humidity

  # update hourly forecast fields, every 10 minutes and on wake
  - id: script_hours
    then: 
      - lvgl.widget.refresh:
          - id: hour0_time
          - id: hour0_icon
          - id: hour0_temp
          - id: hour1_time
          - id: hour1_icon
          - id: hour1_temp
          - id: hour2_time
          - id: hour2_icon
          - id: hour2_temp
          - id: hour3_time
          - id: hour3_icon
          - id: hour3_temp
          - id: hour4_time
          - id: hour4_icon
          - id: hour4_temp
          - id: hour5_time
          - id: hour5_icon
          - id: hour5_temp
          - id: hour6_time
          - id: hour6_icon
          - id: hour6_temp
          - id: hour7_time
          - id: hour7_icon
          - id: hour7_temp
          - id: hour8_time
          - id: hour8_icon
          - id: hour8_temp
          - id: hour9_time
          - id: hour9_icon
          - id: hour9_temp
          - id: hour10_time
          - id: hour10_icon
          - id: hour10_temp
          - id: hour11_time
          - id: hour11_icon
          - id: hour11_temp
          - id: hour12_time
          - id: hour12_icon
          - id: hour12_temp
          - id: hour13_time
          - id: hour13_icon
          - id: hour13_temp
          - id: hour14_time
          - id: hour14_icon
          - id: hour14_temp
          - id: hour15_time
          - id: hour15_icon
          - id: hour15_temp
          - id: hour16_time
          - id: hour16_icon
          - id: hour16_temp
          - id: hour17_time
          - id: hour17_icon
          - id: hour17_temp
          - id: hour18_time
          - id: hour18_icon
          - id: hour18_temp
          - id: hour19_time
          - id: hour19_icon
          - id: hour19_temp
          - id: hour20_time
          - id: hour20_icon
          - id: hour20_temp
          - id: hour21_time
          - id: hour21_icon
          - id: hour21_temp
          - id: hour22_time
          - id: hour22_icon
          - id: hour22_temp
          - id: hour23_time
          - id: hour23_icon
          - id: hour23_temp

  # Update daily forecast fields - every 20 minutes and on wake
  - id: script_days
    then: 
      - lvgl.widget.refresh:
          - id: moon_phase_icon
          - id: moonrise
          - id: forecast_text_0
          - id: forecast_icon_0
          - id: forecast_text_1
          - id: forecast_icon_1
          - id: forecast_text_2
          - id: forecast_icon_2
          - id: forecast_text_3
          - id: forecast_icon_3
          - id: forecast_text_4
          - id: forecast_icon_4
          - id: forecast_text_5
          - id: forecast_icon_5
          - id: forecast_text_6
          - id: forecast_icon_6
      - script.execute: script_forecast_scroll

  # Radar download script - runs every 2 seconds while radar_flag is non-zero (see on_time).  radar_flag is the step
  # of the cycle (1..6); each step starts the download of one frame and that frame's on_download_finished moves
  # radar_flag on.  Frames are loaded OLDEST FIRST and the newest (radar1) last, with the animation held still
  # meanwhile (see step 1 and 5), so the old set stays on screen until the whole new set is in.
  - id: script_radar_download
    then: 
      # A download is already running - ignore this start request
      - if:
          condition:
            lambda: return id(radar_busy);
          then:
            - script.stop: script_radar_download
      # If we have got to 10 errors or more during download of ALL timeslots
      # then give up and display an error message
      - if:
          condition:
            lambda: return id(radar_errors) >= 10;
          then:
            - lambda: id(radar_dlstat) = "Error";
            - lvgl.widget.refresh:
                id: radar_tds
            - lvgl.widget.hide: lbl_downloading
            - lambda: |-
                id(radar_flag) = 0;
                id(radar_errors) = 0;
                id(radar_busy) = false;
                id(radar_updating) = false;
      - if:
          condition:
            lambda: return id(radar_flag) != 0;
          then:
            - if:
                condition:
                  lambda: return id(radar_flag) == 1;
                then:
                  # Cycle start: snapshot the urls / timestamps, and freeze the animation on the newest frame
                  # (radar1 is the one that gets replaced last) so the old set stays on screen, unmixed, while
                  # the new set loads.
                  - lambda: |-
                      id(radar_pu1) = id(radar_url1).state;
                      id(radar_pt1) = id(radar_ts1).state;
                      id(radar_pu2) = id(radar_url2).state;
                      id(radar_pt2) = id(radar_ts2).state;
                      id(radar_pu3) = id(radar_url3).state;
                      id(radar_pt3) = id(radar_ts3).state;
                      id(radar_pu4) = id(radar_url4).state;
                      id(radar_pt4) = id(radar_ts4).state;
                      id(radar_pu5) = id(radar_url5).state;
                      id(radar_pt5) = id(radar_ts5).state;
                      id(radar_pu6) = id(radar_url6).state;
                      id(radar_pt6) = id(radar_ts6).state;
                      id(radar_updating) = true;
                  - if:
                      condition:
                        lambda: return id(radar_ready);
                      then:
                        - lvgl.image.update:
                            id: radar_img
                            src: radar1
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "1/6";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lambda: id(radar_busy) = true;
                  # Home Assistant keeps each frame as /config/www/radar/<frame id>.png (see ha_radar_setup.yaml);
                  # the id is taken from the Rainviewer url the template gives us.  After two failures in a cycle
                  # fall back to Rainviewer itself (384px / zoom 6, shown scaled 4/3 = the old 256px / zoom 7 scale).
                  - online_image.set_url: 
                      id: radar6
                      url: !lambda |-
                        std::string u = id(radar_pu6);
                        std::string rid;
                        size_t a = u.find("/radar/");
                        if (a != std::string::npos) {
                          a += 7;
                          size_t b = u.find('/', a);
                          rid = u.substr(a, b == std::string::npos ? std::string::npos : b - a);
                        }
                        if (!rid.empty() && id(radar_errors) < 2) return "http://192.168.0.100:8123/local/radar/" + rid + ".png";
                        size_t p = u.find("/256/7/");
                        if (p != std::string::npos) u.replace(p, 7, "/384/6/");
                        return u;
                  - logger.log: 
                      format: "Loading radar frame 6 (1/6): %s"
                      args: [id(radar_pu6).c_str()]
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 2;
                then:
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "2/6";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lambda: id(radar_busy) = true;
                  # Home Assistant keeps each frame as /config/www/radar/<frame id>.png (see ha_radar_setup.yaml);
                  # the id is taken from the Rainviewer url the template gives us.  After two failures in a cycle
                  # fall back to Rainviewer itself (384px / zoom 6, shown scaled 4/3 = the old 256px / zoom 7 scale).
                  - online_image.set_url: 
                      id: radar5
                      url: !lambda |-
                        std::string u = id(radar_pu5);
                        std::string rid;
                        size_t a = u.find("/radar/");
                        if (a != std::string::npos) {
                          a += 7;
                          size_t b = u.find('/', a);
                          rid = u.substr(a, b == std::string::npos ? std::string::npos : b - a);
                        }
                        if (!rid.empty() && id(radar_errors) < 2) return "http://192.168.0.100:8123/local/radar/" + rid + ".png";
                        size_t p = u.find("/256/7/");
                        if (p != std::string::npos) u.replace(p, 7, "/384/6/");
                        return u;
                  - logger.log: 
                      format: "Loading radar frame 5 (2/6): %s"
                      args: [id(radar_pu5).c_str()]
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 3;
                then:
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "3/6";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lambda: id(radar_busy) = true;
                  # Home Assistant keeps each frame as /config/www/radar/<frame id>.png (see ha_radar_setup.yaml);
                  # the id is taken from the Rainviewer url the template gives us.  After two failures in a cycle
                  # fall back to Rainviewer itself (384px / zoom 6, shown scaled 4/3 = the old 256px / zoom 7 scale).
                  - online_image.set_url: 
                      id: radar4
                      url: !lambda |-
                        std::string u = id(radar_pu4);
                        std::string rid;
                        size_t a = u.find("/radar/");
                        if (a != std::string::npos) {
                          a += 7;
                          size_t b = u.find('/', a);
                          rid = u.substr(a, b == std::string::npos ? std::string::npos : b - a);
                        }
                        if (!rid.empty() && id(radar_errors) < 2) return "http://192.168.0.100:8123/local/radar/" + rid + ".png";
                        size_t p = u.find("/256/7/");
                        if (p != std::string::npos) u.replace(p, 7, "/384/6/");
                        return u;
                  - logger.log: 
                      format: "Loading radar frame 4 (3/6): %s"
                      args: [id(radar_pu4).c_str()]
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 4;
                then:
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "4/6";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lambda: id(radar_busy) = true;
                  # Home Assistant keeps each frame as /config/www/radar/<frame id>.png (see ha_radar_setup.yaml);
                  # the id is taken from the Rainviewer url the template gives us.  After two failures in a cycle
                  # fall back to Rainviewer itself (384px / zoom 6, shown scaled 4/3 = the old 256px / zoom 7 scale).
                  - online_image.set_url: 
                      id: radar3
                      url: !lambda |-
                        std::string u = id(radar_pu3);
                        std::string rid;
                        size_t a = u.find("/radar/");
                        if (a != std::string::npos) {
                          a += 7;
                          size_t b = u.find('/', a);
                          rid = u.substr(a, b == std::string::npos ? std::string::npos : b - a);
                        }
                        if (!rid.empty() && id(radar_errors) < 2) return "http://192.168.0.100:8123/local/radar/" + rid + ".png";
                        size_t p = u.find("/256/7/");
                        if (p != std::string::npos) u.replace(p, 7, "/384/6/");
                        return u;
                  - logger.log: 
                      format: "Loading radar frame 3 (4/6): %s"
                      args: [id(radar_pu3).c_str()]
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 5;
                then:
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "5/6";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lambda: id(radar_busy) = true;
                  # Home Assistant keeps each frame as /config/www/radar/<frame id>.png (see ha_radar_setup.yaml);
                  # the id is taken from the Rainviewer url the template gives us.  After two failures in a cycle
                  # fall back to Rainviewer itself (384px / zoom 6, shown scaled 4/3 = the old 256px / zoom 7 scale).
                  - online_image.set_url: 
                      id: radar2
                      url: !lambda |-
                        std::string u = id(radar_pu2);
                        std::string rid;
                        size_t a = u.find("/radar/");
                        if (a != std::string::npos) {
                          a += 7;
                          size_t b = u.find('/', a);
                          rid = u.substr(a, b == std::string::npos ? std::string::npos : b - a);
                        }
                        if (!rid.empty() && id(radar_errors) < 2) return "http://192.168.0.100:8123/local/radar/" + rid + ".png";
                        size_t p = u.find("/256/7/");
                        if (p != std::string::npos) u.replace(p, 7, "/384/6/");
                        return u;
                  - logger.log: 
                      format: "Loading radar frame 2 (5/6): %s"
                      args: [id(radar_pu2).c_str()]
                  - script.stop: script_radar_download
            - if:
                condition:
                  lambda: return id(radar_flag) == 6;
                then:
                  # radar1 is about to be replaced - show radar2 (already the new one) while that happens
                  - if:
                      condition:
                        lambda: return id(radar_ready);
                      then:
                        - lvgl.image.update:
                            id: radar_img
                            src: radar2
                  - lvgl.widget.show: lbl_downloading
                  - lambda: id(radar_dlstat) = "6/6";
                  - lvgl.widget.refresh:
                      id: radar_tds
                  - lambda: id(radar_busy) = true;
                  # Home Assistant keeps each frame as /config/www/radar/<frame id>.png (see ha_radar_setup.yaml);
                  # the id is taken from the Rainviewer url the template gives us.  After two failures in a cycle
                  # fall back to Rainviewer itself (384px / zoom 6, shown scaled 4/3 = the old 256px / zoom 7 scale).
                  - online_image.set_url: 
                      id: radar1
                      url: !lambda |-
                        std::string u = id(radar_pu1);
                        std::string rid;
                        size_t a = u.find("/radar/");
                        if (a != std::string::npos) {
                          a += 7;
                          size_t b = u.find('/', a);
                          rid = u.substr(a, b == std::string::npos ? std::string::npos : b - a);
                        }
                        if (!rid.empty() && id(radar_errors) < 2) return "http://192.168.0.100:8123/local/radar/" + rid + ".png";
                        size_t p = u.find("/256/7/");
                        if (p != std::string::npos) u.replace(p, 7, "/384/6/");
                        return u;
                  - logger.log: 
                      format: "Loading radar frame 1 (6/6): %s"
                      args: [id(radar_pu1).c_str()]
                  - script.stop: script_radar_download

  # Satellite image download script            
  - id: script_satellite_download
    then: 
      # similar to radar download - check if flag is set then update online_image url
      - if:
          condition:
            lambda: return id(satellite_flag) != 0;
          then:
            - delay: 15s
            - lvgl.widget.show: lbl_downloading
            - online_image.set_url: 
                id: satellite1
                # Use the url from HA if it supplies one, otherwise the file Home Assistant keeps in
                # /config/www (see ha_satellite_setup.yaml): latest Himawari-9 infrared image of
                # SE Australia from NASA GIBS, 380x330 with coastlines.  The display can't read the
                # GIBS server directly - it sends no Content-Length, which online_image needs.
                url: !lambda |-
                  std::string u = id(satellite_url).state;
                  if (u.empty() || u == "unavailable" || u == "unknown")
                    u = "http://192.168.0.100:8123/local/satellite.png";
                  return u;
      # Give up after 4 failures
      - if:
          condition:
            lambda: return id(satellite_errors) >= 4;
          then:
            - lvgl.widget.hide: lbl_downloading
            - lambda: |-
                id(satellite_flag) = 0;
                id(satellite_errors) = 0;

  # Slow vertical scroll for the forecast text boxes.  For each box, if its label is taller than the box,
  # slide the label up over ~70 ms per pixel, pause, slide back, pause, and repeat.  Restarted whenever the
  # text or the box size changes (daily refresh, mode toggle); a box whose text fits just sits still.
  - id: script_forecast_scroll
    then:
      - lambda: |-
          auto restart = [](lv_obj_t *label, lv_obj_t *box) {
            lv_anim_delete(label, (lv_anim_exec_xcb_t) lv_obj_set_y);
            lv_obj_set_y(label, 0);
            lv_obj_update_layout(box);
            int over = lv_obj_get_height(label) - lv_obj_get_height(box);
            if (over <= 0) return;
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, label);
            lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_y);
            lv_anim_set_values(&a, 0, -over);
            lv_anim_set_duration(&a, over * 70);
            lv_anim_set_reverse_duration(&a, over * 70);
            lv_anim_set_delay(&a, 6000);
            lv_anim_set_reverse_delay(&a, 4000);
            lv_anim_set_repeat_delay(&a, 6000);
            lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
            lv_anim_start(&a);
          };
          restart(forecast_text_0, forecast_box_0);
          restart(forecast_text_1, forecast_box_1);
          restart(forecast_text_2, forecast_box_2);

  # Right hand forecast panel - double tap toggles between the 7 day forecast (mode 0) and a 3 block view
  # (mode 1): long text for today, tomorrow and the day after.  The 3 blocks use the separators at y=176 and
  # y=311 and are 125 / 120 / 120 px tall; text longer than its box scrolls (script_forecast_scroll).
  - id: script_forecast_toggle
    then:
      - lambda: |-
          id(forecast_mode) = (id(forecast_mode) == 0) ? 1 : 0;
      - if:
          condition:
            lambda: return id(forecast_mode) == 1;
          then:
            - lvgl.widget.update:
                id: forecast_box_0
                height: 125
            - lvgl.widget.update:
                id: forecast_box_1
                height: 120
            - lvgl.widget.update:
                id: forecast_icon_2
                y: 316
            - lvgl.widget.update:
                id: forecast_box_2
                y: 320
                height: 120
            - lvgl.widget.hide: forecast_text_3
            - lvgl.widget.hide: forecast_text_4
            - lvgl.widget.hide: forecast_text_5
            - lvgl.widget.hide: forecast_text_6
            - lvgl.widget.hide: forecast_icon_3
            - lvgl.widget.hide: forecast_icon_4
            - lvgl.widget.hide: forecast_icon_5
            - lvgl.widget.hide: forecast_icon_6
            - lvgl.widget.hide: fc_line_2
            - lvgl.widget.hide: fc_line_3
            - lvgl.widget.hide: fc_line_5
            - lvgl.widget.hide: fc_line_6
          else:
            - lvgl.widget.update:
                id: forecast_box_0
                height: 120
            - lvgl.widget.update:
                id: forecast_box_1
                height: 40
            - lvgl.widget.update:
                id: forecast_icon_2
                y: 226
            - lvgl.widget.update:
                id: forecast_box_2
                y: 230
                height: 40
            - lvgl.widget.show: forecast_text_3
            - lvgl.widget.show: forecast_text_4
            - lvgl.widget.show: forecast_text_5
            - lvgl.widget.show: forecast_text_6
            - lvgl.widget.show: forecast_icon_3
            - lvgl.widget.show: forecast_icon_4
            - lvgl.widget.show: forecast_icon_5
            - lvgl.widget.show: forecast_icon_6
            - lvgl.widget.show: fc_line_2
            - lvgl.widget.show: fc_line_3
            - lvgl.widget.show: fc_line_5
            - lvgl.widget.show: fc_line_6
      - lvgl.widget.refresh: forecast_text_1
      - lvgl.widget.refresh: forecast_text_2
      - script.execute: script_forecast_scroll

  # Page selection scripts - only here as placeholders in case any processing require on page change
  - id: page_move_prev
    then:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - lvgl.page.previous:

  - id: page_move_next
    then:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());' 
      - lvgl.page.next:

# Radar animation: step through the frames oldest to newest, holding on the newest for two steps.
# The label shows the time of the frame on screen.  The last two steps of the 8 step cycle are the hold.
interval:
  - interval: 700ms
    then:
      - if:
          condition:
            and:
              - lambda: return id(radar_ready) && !id(radar_updating);
              - not:
                  lvgl.is_paused:
          then:
            - lambda: id(radar_frame) = (id(radar_frame) + 1) % 8;
            - if:
                condition:
                  lambda: return id(radar_frame) == 0;
                then:
                  - lvgl.image.update:
                      id: radar_img
                      src: radar6
                  - lvgl.label.update:
                      id: radar_ts
                      text: !lambda return id(radar_st6);
                  - lvgl.bar.update:
                      id: radar_progress
                      value: 1
            - if:
                condition:
                  lambda: return id(radar_frame) == 1;
                then:
                  - lvgl.image.update:
                      id: radar_img
                      src: radar5
                  - lvgl.label.update:
                      id: radar_ts
                      text: !lambda return id(radar_st5);
                  - lvgl.bar.update:
                      id: radar_progress
                      value: 2
            - if:
                condition:
                  lambda: return id(radar_frame) == 2;
                then:
                  - lvgl.image.update:
                      id: radar_img
                      src: radar4
                  - lvgl.label.update:
                      id: radar_ts
                      text: !lambda return id(radar_st4);
                  - lvgl.bar.update:
                      id: radar_progress
                      value: 3
            - if:
                condition:
                  lambda: return id(radar_frame) == 3;
                then:
                  - lvgl.image.update:
                      id: radar_img
                      src: radar3
                  - lvgl.label.update:
                      id: radar_ts
                      text: !lambda return id(radar_st3);
                  - lvgl.bar.update:
                      id: radar_progress
                      value: 4
            - if:
                condition:
                  lambda: return id(radar_frame) == 4;
                then:
                  - lvgl.image.update:
                      id: radar_img
                      src: radar2
                  - lvgl.label.update:
                      id: radar_ts
                      text: !lambda return id(radar_st2);
                  - lvgl.bar.update:
                      id: radar_progress
                      value: 5
            - if:
                condition:
                  lambda: return id(radar_frame) == 5;
                then:
                  - lvgl.image.update:
                      id: radar_img
                      src: radar1
                  - lvgl.label.update:
                      id: radar_ts
                      text: !lambda return id(radar_st1);
                  - lvgl.bar.update:
                      id: radar_progress
                      value: 6
  # Log free PSRAM once a minute to keep an eye on memory use
  - interval: 60s
    then:
      - logger.log:
          format: "PSRAM free %u (largest block %u), internal free %u"
          args: ['(unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM)', '(unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM)', '(unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL)']

# Sun required for sun elevation sensor used for day/night comparisons
sun:
  latitude: -36.051961
  longitude: 146.458654

# Globals including those used for display and behaviour flags
globals:
  # Array that stores last 30 wind velocity figures for wind compass
  - id: hist_wind
    type: float[30]
  # Array that stores last 30 wind directions for wind compass
  - id: hist_dir
    type: int[30]
  # Wind direction - saved between readings
  - id: dir
    type: int
  # maximum wind in last 30 readings
  - id: maxwind
    type: float
  # used for array lookup for wind compass
  - id: arrayindex
    type: int
  # Flag for first run of device - used to force update of most things EXCEPT radar
  - id: first_run
    type: bool
    initial_value: "true"
  # Flag/counter for downloading radar images
  - id: radar_flag
    type: int
    initial_value: "0"
  # True once a full set of radar frames has been downloaded - the animation script waits for this
  - id: radar_ready
    type: bool
    initial_value: "false"
  # Snapshot of the radar urls and timestamps taken when a download cycle starts.  The HA template shifts
  # its frames whenever Rainviewer publishes a new one, which would otherwise make two frames in one cycle
  # download the same image.  pu = url, pt = timestamp (this cycle), st = timestamp of the frames shown.
  - id: radar_pu1
    type: std::string
  - id: radar_pt1
    type: std::string
  - id: radar_st1
    type: std::string
  - id: radar_pu2
    type: std::string
  - id: radar_pt2
    type: std::string
  - id: radar_st2
    type: std::string
  - id: radar_pu3
    type: std::string
  - id: radar_pt3
    type: std::string
  - id: radar_st3
    type: std::string
  - id: radar_pu4
    type: std::string
  - id: radar_pt4
    type: std::string
  - id: radar_st4
    type: std::string
  - id: radar_pu5
    type: std::string
  - id: radar_pt5
    type: std::string
  - id: radar_st5
    type: std::string
  - id: radar_pu6
    type: std::string
  - id: radar_pt6
    type: std::string
  - id: radar_st6
    type: std::string
  # Right hand forecast panel: 0 = 7 day forecast, 1 = long text for today and tomorrow (double tap toggles)
  - id: forecast_mode
    type: int
    initial_value: "0"
  # Time (millis) of the last tap on the forecast panel, and whether the latest tap completed a double tap
  - id: forecast_last_tap
    type: uint32_t
    initial_value: "0"
  - id: forecast_double_tap
    type: bool
    initial_value: "false"
  # A new newest radar frame arrived while an update cycle was already running - run another when it ends
  - id: radar_again
    type: bool
    initial_value: "false"
  # True from the start of a radar update cycle until its last frame has landed - the animation holds still
  - id: radar_updating
    type: bool
    initial_value: "false"
  # True while a radar frame download is in progress - stops the 12 second timer starting another one
  # (after a long blocked request ESPHome fires the missed timer ticks back to back)
  - id: radar_busy
    type: bool
    initial_value: "false"
  # Current step of the radar animation
  - id: radar_frame
    type: int
    initial_value: "0"
  # Counter for radar download errors
  - id: radar_errors
    type: int
    initial_value: "0"
  # flag to trigger satellite image download
  - id: satellite_flag
    type: int
    initial_value: "0"
  # Counter for satellite image download errors
  - id: satellite_errors
    type: int
    initial_value: "0"
  # Status tring to indicate radar download state 
  - id: radar_dlstat
    type: std::string
  # Time of boot (first time synch)
  - id: boot_time
    type: esphome::ESPTime
  # Flag used to ensure boot_time only stored on FIRST time synch
  - id: boot_time_flag
    type: bool
    initial_value: "true"
  # Time of last successful API connection
  - id: api_connect_time
    type: esphome::ESPTime
  # Flag for indication if the status pop-up window is displayed
  - id: status_hidden
    type: bool
    initial_value: "true"
  # array for presence sensor activation times, must match lvgl dropdowns
  - id: time_array
    type: std::vector<std::string>
    initial_value: '{"18:00:00", "19:00:00", "20:00:00", "21:00:00", "22:00:00", "23:00:00", "00:00:00", "01:00:00", "02:00:00", "03:00:00", "04:00:00", "05:00:00", "06:00:00", "07:00:00", "08:00:00"}'
  # storage for start and end times of presence checking
  - id: presence_end_index
    type: int
    initial_value: "0"
    restore_value: True
  - id: presence_start_index
    type: int
    initial_value: "11"
    restore_value: True

# http_request block required for online_image: - note the watchdog timeout needs to longer 
# than the timeout: value - this prevents rebouts when http_request: blocks EVERYTHING ^&%^&%%$!!
http_request:
  timeout: 20s
  # 2026.x derives 3 x timeout + 1s for the request watchdog; keep ours at least that long
  watchdog_timeout: 61s

# Online images
online_image: 
  # Temperature plot sourced from a HA history graph using the Puppet add-on
  # from https://github.com/balloob/home-assistant-addons repository
  # - url: "http://192.168.0.100:10000/dashboard-cast/1?viewport=220x220&dark=&wait=3000&lang=en"
  - url: "http://192.168.0.100:10000/dashboard-cast/1?viewport=220x220&colors=ADD8E6%2C+000000%2C+ffffff%2C+FFDE21&palette_colors=ADD8E6%2C+000000%2C+ffffff%2C+FFDE21&dark=&wait=3000&lang=en"
    id: templot
    format: png
    type: RGB565
    # note we simply update this every 10 mins
    update_interval: 10min
    # If it doesn't work - either leave empty or show previous
    on_download_finished:
      then: 
        - delay: 1s
        - lvgl.image.update:
            id: templot_img
            src: templot

  # 14day temp and rain history using Apexcharts and the Puppet add-on
  # from https://github.com/balloob/home-assistant-addons repository
  - url: "http://192.168.0.100:10000/dashboard-cast/history?viewport=780x360&wait=8500&dark"
    id: plot14day
    format: png
    type: RGB565
    # note we simply update this every 10 mins
    update_interval: 5min
    # If it doesn't work - either leave empty or show previous
    on_download_finished:
      then: 
        - delay: 1s
        - lvgl.image.update:
            id: hist14day_img
            src: plot14day


  # Radar images - the six frames the download script fills (url / timestamp 1 = newest).  Frames are 384x384 with
  # an alpha channel (3 bytes/pixel) and are scaled up 4/3 on screen, so they look like 512px frames but fit in
  # PSRAM.  (chroma_key transparency does not work with LVGL 9 - it just draws the key colour.)
  - url: "https://google.com/dummy.png"
    id: radar6
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: |-
            id(radar_flag) = 2;
            id(radar_busy) = false;
    on_error: 
      # If the download fails, increment error flag.  The radar flag is not updated thus
      # the radar download script will attempt this image again on next run
      then:
        - lambda: |-
            ++id(radar_errors);
            id(radar_busy) = false;

  - url: "https://google.com/dummy.png"
    id: radar5
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: |-
            id(radar_flag) = 3;
            id(radar_busy) = false;
    on_error: 
      # If the download fails, increment error flag.  The radar flag is not updated thus
      # the radar download script will attempt this image again on next run
      then:
        - lambda: |-
            ++id(radar_errors);
            id(radar_busy) = false;

  - url: "https://google.com/dummy.png"
    id: radar4
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: |-
            id(radar_flag) = 4;
            id(radar_busy) = false;
    on_error: 
      # If the download fails, increment error flag.  The radar flag is not updated thus
      # the radar download script will attempt this image again on next run
      then:
        - lambda: |-
            ++id(radar_errors);
            id(radar_busy) = false;

  - url: "https://google.com/dummy.png"
    id: radar3
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: |-
            id(radar_flag) = 5;
            id(radar_busy) = false;
    on_error: 
      # If the download fails, increment error flag.  The radar flag is not updated thus
      # the radar download script will attempt this image again on next run
      then:
        - lambda: |-
            ++id(radar_errors);
            id(radar_busy) = false;

  - url: "https://google.com/dummy.png"
    id: radar2
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      then: 
        - lambda: |-
            id(radar_flag) = 6;
            id(radar_busy) = false;
    on_error: 
      # If the download fails, increment error flag.  The radar flag is not updated thus
      # the radar download script will attempt this image again on next run
      then:
        - lambda: |-
            ++id(radar_errors);
            id(radar_busy) = false;

  - url: "https://google.com/dummy.png"
    id: radar1
    format: png
    type: RGB565
    transparency: alpha_channel
    on_download_finished:
      # last frame (the newest) done: the whole new set is in.  Publish its timestamps, reset the cycle and
      # restart the animation from the oldest frame.
      then: 
        - lambda: |-
            id(radar_dlstat) = "-";
            id(radar_flag) = 0;
            id(radar_errors) = 0;
            id(radar_ready) = true;
            id(radar_busy) = false;
            // HA only gives the time of each frame (e.g. "3:00 PM") - add the date from the current time.
            // A frame time later than now (by more than 10 min) must be from before midnight.
            auto now = id(my_time).now();
            auto dated = [&](const std::string &t) -> std::string {
              int h = 0, m = 0;
              char ap[3] = {0};
              if (!now.is_valid() || sscanf(t.c_str(), "%d:%d %2s", &h, &m, ap) != 3) return t;
              if (h == 12) h = 0;
              if (ap[0] == 'P' || ap[0] == 'p') h += 12;
              time_t ts = now.timestamp;
              if (h * 60 + m > now.hour * 60 + now.minute + 10) ts -= 86400;
              return esphome::ESPTime::from_epoch_local(ts).strftime("%a %d %b ") + t;
            };
            id(radar_st1) = dated(id(radar_pt1));
            id(radar_st2) = dated(id(radar_pt2));
            id(radar_st3) = dated(id(radar_pt3));
            id(radar_st4) = dated(id(radar_pt4));
            id(radar_st5) = dated(id(radar_pt5));
            id(radar_st6) = dated(id(radar_pt6));
            id(radar_frame) = 7;
            id(radar_updating) = false;
            if (id(radar_again)) {
              id(radar_again) = false;
              id(radar_flag) = 1;
            }
        - lvgl.widget.hide: lbl_downloading
        - lvgl.widget.refresh:
            id: radar_tds
    on_error: 
      # If the download fails, increment error flag.  The radar flag is not updated thus
      # the radar download script will attempt this image again on next run
      then:
        - lambda: |-
            ++id(radar_errors);
            id(radar_busy) = false;

  # Satellite image - a PNG served by Home Assistant from /config/www (Himawari-9 infrared via NASA GIBS)
  - url: "http://192.168.0.100:8123/local/satellite.png"
    id: satellite1
    format: png
    type: RGB565
    on_download_finished:
      then: 
        # update the image
        - lvgl.image.update:
            id: satellite
            src: satellite1
        # hide the downloading icon
        - lvgl.widget.hide: lbl_downloading
        # reset flags and counters
        - lambda: id(satellite_flag) = 0;
        - lambda: id(satellite_errors) = 0;
        # update the timestamp text
        - lvgl.widget.refresh: 
            id: sat_ts
    on_error: 
      # if download error - stop script and count the error.  Retry (after the script's 15s delay) up to
      # 4 times, then give up until the next scheduled refresh.  (The give-up check has to be here:
      # script.stop ends the script before it could reach a check at the end of script_satellite_download.)
      then:
        - script.stop: script_satellite_download    
        - lambda: ++id(satellite_errors);
        - if:
            condition:
              lambda: return id(satellite_errors) < 4;
            then:
              - script.execute: script_satellite_download    
            else:
              - lvgl.widget.hide: lbl_downloading
              - lambda: |-
                  id(satellite_flag) = 0;
                  id(satellite_errors) = 0;

# Static images
image: 
  # Base map for the radar panel: 380x330 window, same scale and centre as the 512px zoom 6 radar frames
  # (generated from Esri street map tiles with town labels and a marker for Rutherglen)
  - file: "radar_base.png"
    id: background_map
    type: RGB565

