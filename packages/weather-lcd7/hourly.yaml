# weather-lcd7 package: hourly - hourly forecast: 24 temperature sensors, icons, times and the script that fills the strip

script:

  # update hourly forecast fields, every 10 minutes and on wake
  - id: script_hours
    then: 
      - lvgl.widget.refresh:
