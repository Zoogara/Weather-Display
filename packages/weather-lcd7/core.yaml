# weather-lcd7 package: core - time, theme and styles, fonts, page navigation and shared helpers

# Time sourced from Home Assitant
time:
  - platform: homeassistant
    id: my_time
    on_time_sync:
      then:
        # Display clock on title bar
        - lvgl.label.update:
            id: lbl_datetime
            text: 
              time_format: "%H:%M - %a %d %b"
              time: my_time 
        # Set global storing time of first time synch - we will display this as boot time on status page
        - lambda: |-
            if (id(boot_time_flag))
              { id(boot_time) = id(my_time).now();
                id(boot_time_flag) = false;
              }
        - logger.log:
            format: "Time now is: %X"
            args: id(my_time).now()
    on_time:
      # Update clock on title bar, every five seconds is accurate enough.
      - seconds: /5
        then: 
          - lvgl.label.update:
              id: lbl_datetime
              text: 
                time_format: "%H:%M - %a %d %b"
                time: my_time
      # Download radar - using timer means script doesn't block (maybe)
      # Only run script if flag is set and script not already running
      # This will only run when the on_time: minutes: 1, 11, 21, 31, 41, 51 has run first
      # i.e. this runs every 2 secs from the time the main script runs until the radar images are all downloaded.
      - seconds: /2
        then:
          - if:
              condition:
                and:
                  - lambda: return id(radar_flag) > 0;
                  - not:
                      script.is_running: script_radar_download
              then:
                - script.execute: script_radar_download
      # Update observation labels once a minute
      - seconds: 0
        minutes: /1
        then: 
          - script.execute: script_obs
      # Update hourly forecast data every ten minutes
      - seconds: 0
        minutes: 1, 11, 21, 31, 41, 51
        then: 
          - script.execute: script_hours
      # Radar updates are NOT started from a clock any more: Home Assistant delivers each new frame 1-2 minutes
      # after its time stamp, and a fixed time kept being a minute too early (so the display showed the previous
      # set for another ten minutes).  The radar update now starts when the newest frame changes (on_value of
      # radar_url1).  This is just a slow safety net in case that event is ever missed.
      - seconds: 0
        minutes: 7, 37
        then:
          - if:
              condition:
                - lambda: return id(radar_flag) == 0 && !id(radar_busy);
              then: 
                - lambda: id(radar_flag) = 1;
      # Himawari-9 infrared is updated every 10 minutes but arrives with a delay, so refresh twice an hour
      - seconds: 0
        minutes: 3, 33
        then:
          - lambda: id(satellite_flag) = 1;
          - script.execute: script_satellite_download
      # Update daily forecast every 20 min - this is good enough to keep up with BOM updates
      - seconds: 0
        minutes: /20
        then: 
          - script.execute: script_days
      # restart each morning at 1:00am
      - hours: 1
        minutes: 0
        seconds: 0
        then:
          - switch.turn_on: restart_switch

script:

  # Page selection scripts - only here as placeholders in case any processing require on page change
  - id: page_move_prev
    then:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - lvgl.page.previous:

  - id: page_move_next
    then:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());' 
      - lvgl.page.next:

