lvgl:
  
  # Page definitions - note that with LVGL page order in yaml is the same as compiled code
  pages:
  
    # Page for light control - some spare buttons
    # yaml is mostly copied drom the LVGL Tips & Tricks page "Toggle state icon button"
    # therfe may be a way of making this less "bulky" - for future date
    - id: lights_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "${town} Lights"
      bg_color: 0x000000
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  

      widgets:
        # grid layout object for all buttons
        - obj: 
            align: CENTER
            width: 800
            height: 400
            pad_all: 6
            bg_opa: TRANSP
            border_opa: TRANSP
            press_lock: false
            # 4 x 3 grid for buttons - makes them big enough to display both icon and label
            layout: 
              type: GRID 
              pad_row: 6
              pad_column: 8
              grid_columns: [FR(1), FR(1), FR(1), FR(1)]
              grid_rows: [FR(1), FR(1), FR(1)] 
            widgets:
              # buttons - same code for all differe only in icon (group or single) and label
              # plus whatever the code controls
              - button:
                  id: light1
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  widgets:
                    - label:
                        id: icon_light1
                        align: CENTER
                        text_font: mdi_42
                        text: "\U000F0336"
                    - label:
                        id: lbl_light1
                        align_to: 
                          id: icon_light1
                          align: OUT_BOTTOM_MID
                        text: "Office"
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.office_lights
                  on_long_press:
                    - homeassistant.action:
                        action: light.turn_off
                        data:
                          entity_id: light.office_lights
