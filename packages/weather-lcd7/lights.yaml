# weather-lcd7 package: lights - lights page

text_sensor:
    
  # Text sensor for controlling state of icons on lights page
  - platform: homeassistant
    id: light1_remote_light
    entity_id: light.office_lights
    on_value:
      then:
        - lvgl.widget.update:
            id: light1
            state:
              checked: !lambda return (0 == x.compare(std::string{"on"}));
              disabled: !lambda return ((0 == x.compare(std::string{"unavailable"})) or (0 == x.compare(std::string{"unknown"})));
        - lvgl.label.update:
            id: icon_light1
            text: !lambda |-
              static char buf[10];
              std::string icon;
              if (0 == x.compare(std::string{"on"})) {
                  icon = "\U000F0335";
              } else {
                  icon = "\U000F0336";
              }
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;
