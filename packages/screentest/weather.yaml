# screentest package: weather - weather page: observations, hourly and daily forecast, forecast panel, Puppet temperature plot

script:
  # update all observation fields - called on wake and every minute
  - id: script_obs
    then: 
      - lvgl.widget.refresh:
          - id: icon_today
          - id: short_today
          - id: feels_like
          - id: atmo_pressure
          - id: current_temp
          - id: sunrise
          - id: sunset
          - id: humidity

  # update hourly forecast fields, every 10 minutes and on wake
  - id: script_hours
    then: 
      - lvgl.widget.refresh:
          - id: hour0_time
          - id: hour0_icon
          - id: hour0_temp
          - id: hour1_time
          - id: hour1_icon
          - id: hour1_temp
          - id: hour2_time
          - id: hour2_icon
          - id: hour2_temp
          - id: hour3_time
          - id: hour3_icon
          - id: hour3_temp
          - id: hour4_time
          - id: hour4_icon
          - id: hour4_temp
          - id: hour5_time
          - id: hour5_icon
          - id: hour5_temp
          - id: hour6_time
          - id: hour6_icon
          - id: hour6_temp
          - id: hour7_time
          - id: hour7_icon
          - id: hour7_temp
          - id: hour8_time
          - id: hour8_icon
          - id: hour8_temp
          - id: hour9_time
          - id: hour9_icon
          - id: hour9_temp
          - id: hour10_time
          - id: hour10_icon
          - id: hour10_temp
          - id: hour11_time
          - id: hour11_icon
          - id: hour11_temp
          - id: hour12_time
          - id: hour12_icon
          - id: hour12_temp
          - id: hour13_time
          - id: hour13_icon
          - id: hour13_temp
          - id: hour14_time
          - id: hour14_icon
          - id: hour14_temp
          - id: hour15_time
          - id: hour15_icon
          - id: hour15_temp
          - id: hour16_time
          - id: hour16_icon
          - id: hour16_temp
          - id: hour17_time
          - id: hour17_icon
          - id: hour17_temp
          - id: hour18_time
          - id: hour18_icon
          - id: hour18_temp
          - id: hour19_time
          - id: hour19_icon
          - id: hour19_temp
          - id: hour20_time
          - id: hour20_icon
          - id: hour20_temp
          - id: hour21_time
          - id: hour21_icon
          - id: hour21_temp
          - id: hour22_time
          - id: hour22_icon
          - id: hour22_temp
          - id: hour23_time
          - id: hour23_icon
          - id: hour23_temp

  # Update daily forecast fields - every 20 minutes and on wake
  - id: script_days
    then: 
      - lvgl.widget.refresh:
          - id: moon_phase_icon
          - id: moonrise
          - id: forecast_text_0
          - id: forecast_icon_0
          - id: forecast_text_1
          - id: forecast_icon_1
          - id: forecast_text_2
          - id: forecast_icon_2
          - id: forecast_text_3
          - id: forecast_icon_3
          - id: forecast_text_4
          - id: forecast_icon_4
          - id: forecast_text_5
          - id: forecast_icon_5
          - id: forecast_text_6
          - id: forecast_icon_6
      - script.execute: script_forecast_scroll

  # Slow vertical scroll for the forecast text boxes.  For each box, if its label is taller than the box,
  # slide the label up over ~70 ms per pixel, pause, slide back, pause, and repeat.  Restarted whenever the
  # text or the box size changes (daily refresh, mode toggle); a box whose text fits just sits still.
  - id: script_forecast_scroll
    then:
      - lambda: |-
          auto restart = [](lv_obj_t *label, lv_obj_t *box) {
            lv_anim_delete(label, (lv_anim_exec_xcb_t) lv_obj_set_y);
            lv_obj_set_y(label, 0);
            lv_obj_update_layout(box);
            int over = lv_obj_get_height(label) - lv_obj_get_height(box);
            if (over <= 0) return;
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, label);
            lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_y);
            lv_anim_set_values(&a, 0, -over);
            lv_anim_set_duration(&a, over * 70);
            lv_anim_set_reverse_duration(&a, over * 70);
            lv_anim_set_delay(&a, 6000);
            lv_anim_set_reverse_delay(&a, 4000);
            lv_anim_set_repeat_delay(&a, 6000);
            lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
            lv_anim_start(&a);
          };
          restart(forecast_text_0, forecast_box_0);
          restart(forecast_text_1, forecast_box_1);
          restart(forecast_text_2, forecast_box_2);

  # Right hand forecast panel - double tap toggles between the 7 day forecast (mode 0) and a 3 block view
  # (mode 1): long text for today, tomorrow and the day after.  The 3 blocks use the separators at y=176 and
  # y=311 and are 125 / 120 / 120 px tall; text longer than its box scrolls (script_forecast_scroll).
  - id: script_forecast_toggle
    then:
      - lambda: |-
          id(forecast_mode) = (id(forecast_mode) == 0) ? 1 : 0;
      - if:
          condition:
            lambda: return id(forecast_mode) == 1;
          then:
            - lvgl.widget.update:
                id: forecast_box_0
                height: 125
            - lvgl.widget.update:
                id: forecast_box_1
                height: 120
            - lvgl.widget.update:
                id: forecast_icon_2
                y: 316
            - lvgl.widget.update:
                id: forecast_box_2
                y: 320
                height: 120
            - lvgl.widget.hide: forecast_text_3
            - lvgl.widget.hide: forecast_text_4
            - lvgl.widget.hide: forecast_text_5
            - lvgl.widget.hide: forecast_text_6
            - lvgl.widget.hide: forecast_icon_3
            - lvgl.widget.hide: forecast_icon_4
            - lvgl.widget.hide: forecast_icon_5
            - lvgl.widget.hide: forecast_icon_6
            - lvgl.widget.hide: fc_line_2
            - lvgl.widget.hide: fc_line_3
            - lvgl.widget.hide: fc_line_5
            - lvgl.widget.hide: fc_line_6
          else:
            - lvgl.widget.update:
                id: forecast_box_0
                height: 120
            - lvgl.widget.update:
                id: forecast_box_1
                height: 40
            - lvgl.widget.update:
                id: forecast_icon_2
                y: 226
            - lvgl.widget.update:
                id: forecast_box_2
                y: 230
                height: 40
            - lvgl.widget.show: forecast_text_3
            - lvgl.widget.show: forecast_text_4
            - lvgl.widget.show: forecast_text_5
            - lvgl.widget.show: forecast_text_6
            - lvgl.widget.show: forecast_icon_3
            - lvgl.widget.show: forecast_icon_4
            - lvgl.widget.show: forecast_icon_5
            - lvgl.widget.show: forecast_icon_6
            - lvgl.widget.show: fc_line_2
            - lvgl.widget.show: fc_line_3
            - lvgl.widget.show: fc_line_5
            - lvgl.widget.show: fc_line_6
      - lvgl.widget.refresh: forecast_text_1
      - lvgl.widget.refresh: forecast_text_2
      - script.execute: script_forecast_scroll
# Sun required for sun elevation sensor used for day/night comparisons
sun:
  latitude: ${latitude}
  longitude: ${longitude}

# Globals including those used for display and behaviour flags
globals:
  # Wind direction - saved between readings
  - id: dir
    type: int
  # maximum wind in last 30 readings
  - id: maxwind
    type: float
  # used for array lookup for wind compass
  - id: arrayindex
    type: int
  # Flag for first run of device - used to force update of most things EXCEPT radar
  - id: first_run
    type: bool
    initial_value: "true"
  # Right hand forecast panel: 0 = 7 day forecast, 1 = long text for today and tomorrow (double tap toggles)
  - id: forecast_mode
    type: int
    initial_value: "0"
  # Time (millis) of the last tap on the forecast panel, and whether the latest tap completed a double tap
  - id: forecast_last_tap
    type: uint32_t
    initial_value: "0"
  - id: forecast_double_tap
    type: bool
    initial_value: "false"
# Online images
online_image: 
  # Temperature plot sourced from a HA history graph using the Puppet add-on
  # from https://github.com/balloob/home-assistant-addons repository
  # - url: "${puppet_url}/dashboard-cast/1?viewport=220x220&dark=&wait=3000&lang=en"
  - url: "${puppet_url}/dashboard-cast/1?viewport=220x220&colors=ADD8E6%2C+000000%2C+ffffff%2C+FFDE21&palette_colors=ADD8E6%2C+000000%2C+ffffff%2C+FFDE21&dark=&wait=3000&lang=en"
    id: templot
    format: png
    type: RGB565
    # note we simply update this every 10 mins
    update_interval: 10min
    # If it doesn't work - either leave empty or show previous
    on_download_finished:
      then: 
        - delay: 1s
        - lvgl.image.update:
            id: templot_img
            src: templot
