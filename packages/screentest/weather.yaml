                  text: !lambda |-
                    // 7 day mode: short text.  3 block mode: the long text (already starts with the day and
                    // min/max), or the short text if the long text hasn't arrived
                    std::string s = id(forecast2).state;
                    if (id(forecast_mode) == 0) return s;
                    std::string ext = id(forecast2_long).state;
                    if (ext.size() < 20 || ext == "unknown" || ext == "unavailable") return s;
