lvgl:
  
  # Page definitions - note that with LVGL page order in yaml is the same as compiled code
  pages:
    # Weather information sourced from Ecowitt and BOM
    - id: weather_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "${town} Weather"
      bg_color: 0x000000
      # Swipe triggers for page navigation - duplicates same as buttons
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  
      widgets:
    # Wind Rose
        # Canvas used for drawing wind history - behind all other objects on this page
        - canvas:
            id: wind_stick
            x: 50
            y: 140
            height: 180
            width: 180
        # Circle used for wind compass
        - arc:
            x: 50
            y: 140
            height: 180
            width: 180
            id: wind_rose
            arc_width: 2
            start_angle: 0
            end_angle: 360
            adjustable: false 
            arc_color: WHITE   
        # "Filled" arc used for pointer for wind compass
        - arc:
            id: dir_indicator
            x: 10
            y: 10
            start_angle: 0
            end_angle: 360
            arc_width: 6
            adjustable: false 
            height: 12
            width: 12
            arc_color: BLUE
        # Cardinal directions labels
        - label:
            x: 50
            y: 110
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "N"
        - label:
            x: 50
            y: 334
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "S"
        - label:
            x: 244
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "E" 
        - label:
            x: 21
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "W"      
        # Label for named wind direction       
        - label:
            id: dir_text
            x: 50
            y: 180
            text_font: calibri_25
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "-"
        # Units label which appers below wind speed
        - label:
            x: 50
            y: 250
            text_font: calibri_19
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "km/h"
        # Wind speed
        - label:
            id: speed_text
            x: 50
            y: 210
            text_font: calibri_40
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "-"

    # Observations
        # Icon for current day weather - top left of display
        - label:
            id: icon_today
            x: 20
            y: 45
            text_font: weather_36
            text_color: WHITE
            text: !lambda return id(icon0).state;
        # Current temperature from Ecowitt (not BOM)
        - label: 
            id: current_temp
            x: 87
            y: 46
            text_font: calibri_25
            text_color: WHITE
            text: !lambda return (id(temp).state + " °C").c_str();
        # BOM short "forecast" for today
        - label:
            id: short_today
            x: 87
            y: 73
            styles: forecast_text
            text_color: WHITE
            text: !lambda return id(forecasttoday).state;
            height: 25
            width: 135
        # Feels like icon and value
        - label: 
            id: feels_like_icon
            x: 235
            y: 40
            text_font: forecast_24
            text_color: WHITE
            text: "A"
        - label: 
            id: feels_like
            x: 270
            y: 49
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(fl).state + " °C").c_str();
        # Rain guage icon and total since midnight
        - label: 
            id: rain_total_icon
            x: 235
            y: 65
            text_font: forecast_24
            text_color: WHITE
            text: "B"
        - label: 
            id: rain_total
            x: 270
            y: 74
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(total_rain).state + " mm").c_str();
        # atmospheric pressure icon and value
        - label: 
            id: atmo_pressure_icon
            x: 235
            y: 90
            text_font: forecast_24
            text_color: WHITE
            text: "C"        
        - label: 
            id: atmo_pressure
            x: 270
            y: 99
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(pressure).state + " hPa").c_str();
        # Wind gust icon and value from Ecowitt
        - label: 
            id: wind_gust_icon
            x: 235
            y: 115
            text_font: forecast_24
            text_color: WHITE
            text: "D"        
        - label: 
            id: wind_gust
            x: 270
            y: 124
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(gust).state + " km/h").c_str();
        # Next sunrise icon and value
        - label: 
            id: sunrise_icon
            x: 360
            y: 40
            text_font: forecast_24
            text_color: WHITE
            text: "F"
        - label: 
            id: sunrise
            x: 395
            y: 49
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return id(sunrise_next_text).state;
        # Next sunset icon and value
        - label: 
            id: sunset_icon
            x: 360
            y: 65
            text_font: forecast_24
            text_color: WHITE
            text: "E"
        - label: 
            id: sunset
            x: 395
            y: 74
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return id(sunset_next_text).state;
        # Humidity icon and value from Ecowitt
        - label: 
            id: humidity_icon
            x: 360
            y: 90
            text_font: forecast_24
            text_color: WHITE
            text: "G"        
        - label: 
            id: humidity
            x: 395
            y: 99
            text_font: calibri_17
            text_color: WHITE
            text: !lambda |-
                    char h[20];
                    snprintf(h, sizeof(h), "%.0f %%", id(bomhumidity).state);
                    return h;
        # Moon phase icon from HA sensor and value
        - label: 
            id: moon_phase_icon
            x: 360
            y: 115
            text_font: weather_24
            text_color: WHITE
            text: !lambda return id(moon_phase).state;
        - label: 
            id: moonrise
            x: 395
            y: 124
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return id(moonrise_time).state;

    # temperature plot
        # Temperature graph showing BOM and Ecowitt temp plot for last 6 hours
        # Image sourced from HA using Puppet add-on
        - image: 
            id: templot_img
            x: 255
            y: 150
            src: templot

    # Hourly forecast
        # Forcast data for 24 hours, in scrolling grid
