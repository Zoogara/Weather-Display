# screentest package: weather - weather page: current observations, wind rose, Puppet temperature plot, page layout

script:
  # update all observation fields - called on wake and every minute
  - id: script_obs
    then: 
      - lvgl.widget.refresh:
          - id: icon_today
          - id: short_today
          - id: feels_like
          - id: atmo_pressure
          - id: current_temp
          - id: sunrise
          - id: sunset
          - id: humidity
# Sun required for sun elevation sensor used for day/night comparisons
sun:
  latitude: ${latitude}
  longitude: ${longitude}

# Globals including those used for display and behaviour flags
globals:
  # Wind direction - saved between readings
  - id: dir
    type: int
  # maximum wind in last 30 readings
  - id: maxwind
    type: float
  # used for array lookup for wind compass
  - id: arrayindex
    type: int
  # Flag for first run of device - used to force update of most things EXCEPT radar
  - id: first_run
    type: bool
    initial_value: "true"
# Online images
online_image: 
  # Temperature plot sourced from a HA history graph using the Puppet add-on
  # from https://github.com/balloob/home-assistant-addons repository
  # - url: "${puppet_url}/dashboard-cast/1?viewport=220x220&dark=&wait=3000&lang=en"
  - url: "${puppet_url}/dashboard-cast/1?viewport=220x220&colors=ADD8E6%2C+000000%2C+ffffff%2C+FFDE21&palette_colors=ADD8E6%2C+000000%2C+ffffff%2C+FFDE21&dark=&wait=3000&lang=en"
    id: templot
    format: png
    type: RGB565
    # note we simply update this every 10 mins
    update_interval: 10min
    # If it doesn't work - either leave empty or show previous
    on_download_finished:
      then: 
        - delay: 1s
        - lvgl.image.update:
            id: templot_img
            src: templot
# All sensors sourced from HA - Ecowitt weather station sensors
# BOM weather forecast sensors using custom template sesnors mostly
sensor:

  # sun
  - platform: sun
    id: sun_elevation
    type: elevation

  # numeric sensors from BOM
  - platform: homeassistant
    id: bomhumidity
    entity_id: sensor.${bom_prefix}_humidity
  - platform: homeassistant
    id: sunrise_next
    entity_id: sensor.weather_data
    attribute: sunrise
  - platform: homeassistant
    id: sunset_next
    entity_id: sensor.weather_data
    attribute: sunset
text_sensor:

  # weather sensors
  # Ecowitt weather station outside temp
  - platform: homeassistant
    entity_id: sensor.weather_station_temperature
    id: temp
  # Ecowitt wind direction - this is one of the few sensors that updates on value
  # as it is fairly dynamic.  The code updates the array with values then updates the wind compass and 
  # displayed values
  - platform: homeassistant
    entity_id: sensor.wind_direction
    id: wind_dir
    on_value: 
      # note we do these loops in ! lambda as using yaml loops for more that 10 repeats
      # causes crashes / buffer overflows
      then:
        # update array used for compas / wind stick
        - lambda: |-
            static int index=0;
            static int prev_index=29;
            // Convert wind direction to int, speed to float
            id(dir) = atoi(id(wind_dir).state.c_str());
            float speed = atof(id(wind_speed).state.c_str());
            // Store in array
            if ((id(hist_wind)[prev_index]!=speed || id(hist_dir)[prev_index]!=id(dir)) && speed!=0) {
              id(hist_wind)[index] = speed;
              id(hist_dir)[index] = id(dir);
              index += 1;
              prev_index += 1;
              if (index==30) { index = 0; }
              if (prev_index==30) { prev_index = 0; }
            }
            // Trend maximum for last 30
            id(maxwind) = id(hist_wind)[0];
            for (size_t i = 0; i < 30; ++i) {
              if (id(hist_wind)[i] > id(maxwind)) {
                id(maxwind) = id(hist_wind)[i];
              }
            }
        # calculate coordinates for wind direction indicator - this is drawn in the wind speed sensor
        - lvgl.widget.update:
            id: dir_indicator
            x: !lambda |-
              return  90 + 50 - 6 + (89 * (cos((id(dir)-90)*M_PI/180)));
            y: !lambda |-
              return  90 + 140 - 6 + (89 * (sin((id(dir)-90)*M_PI/180)));
        # clear canvas for wind sticks
        - lvgl.canvas.fill:
            id: wind_stick
            color: BLACK
        # Draw wind stick - again can use yaml loops becase they don't work.  Use c++ LVGL code
        # for drawing
        - lambda: |-
            lv_layer_t layer;
            lv_canvas_init_layer(wind_stick, &layer);
            lv_draw_line_dsc_t line_dsc;
            lv_draw_line_dsc_init(&line_dsc);
            line_dsc.width = 1;
            line_dsc.color = lv_palette_lighten(LV_PALETTE_GREEN, 3);
            line_dsc.opa = LV_OPA_COVER;
            line_dsc.round_start = 0;
            line_dsc.round_end = 0;
            // loop through array to draw direction / force lines for last 30 readings
            for (int ax = 0; ax < 30; ++ax)  {
              float a = (id(hist_dir)[ax]-90)*M_PI/180;
              float r2 = 90-(70*id(hist_wind)[ax]/id(maxwind));
              line_dsc.p1.x = 90 + 90*cos(a);
              line_dsc.p1.y = 90 + 90*sin(a);
              line_dsc.p2.x = 90 + r2*cos(a);
              line_dsc.p2.y = 90 + r2*sin(a);
              lv_draw_line(&layer, &line_dsc);
            }
            lv_canvas_finish_layer(wind_stick, &layer);

  # Wind speed from Ecowitt,.
  - platform: homeassistant
    entity_id: sensor.wind_speed
    id: wind_speed
    on_value: 
      then:
        # draw indicator for wind compass, colour based on wind speed
        - lvgl.widget.update:
            id: dir_indicator
            arc_color: !lambda |-
              float speed = atof(x.c_str());
              if (speed<=11) return lv_palette_lighten(LV_PALETTE_BLUE, 3); 
              if (speed>11 && speed<=30) return lv_palette_main(LV_PALETTE_GREEN); 
              if (speed>30 && speed<=60) return lv_palette_main(LV_PALETTE_ORANGE); 
              return lv_palette_main(LV_PALETTE_RED); 
        # Update wind speed value - formatting changes depending on how many leading digits
        - if:
            condition:
              lambda: |-
                return (atof(x.c_str())<10);
            then:
              - lvgl.label.update:
                  id: speed_text
                  text: 
                    format: "%.1f"
                    args: [atof(x.c_str())]
            else:
              - lvgl.label.update:
                  id: speed_text
                  text: 
                    format: "%.0f"
                    args: [atof(x.c_str())]

  # named wind direction from Ecowoitt
  - platform: homeassistant
    entity_id: sensor.named_wind_direction
    id: named_dir
    on_value:
      # we chose this sensor to perform first update scripts - no particular reasoning why this one chosen
      then:
        - lvgl.label.update:
            id: dir_text
            text: !lambda return x;
        - if:
            condition:
              lambda: return id(first_run);
            then:
              # Clear the flag straight away so later updates of this sensor can't start this block again.
              - lambda: id(first_run) = false;
              # This sensor's state arrives early in Home Assistant's burst of initial states.
              # Wait (non-blocking) so the rest of the burst - forecast, hourly etc - is processed
              # before we refresh the labels. The http_request calls below block the main loop,
              # so they must come after this delay too.
              - delay: 10s
              - script.execute: script_obs
              - script.execute: script_hours
              - script.execute: script_days
              - component.update: templot
              - component.update: plot14day
              - script.execute: script_radar_download
              - lambda: id(satellite_flag) = 1;
              - script.execute: script_satellite_download

  # Ecowitt total rain since midnight - updated real time
  - platform: homeassistant
    entity_id: sensor.rain_accumulation
    id: total_rain
    on_value: 
      then:
        lvgl.widget.refresh:
          - id: rain_total

  # Ecowitt air pressure (mean sea level adjusted0)
  - platform: homeassistant
    entity_id: sensor.atmospheric_pressure_msl
    id: pressure

  # Ecowitt rain gust - updated real time
  - platform: homeassistant
    entity_id: sensor.wind_gust
    id: gust
    on_value: 
      then:
        lvgl.widget.refresh:
          - id: wind_gust

  # Mon phase and moorise time - note phase is simply correct icon supplied by HA template sensor
  - platform: homeassistant
    entity_id: sensor.template_weather_display_moon_icon
    id: moon_phase
  - platform: homeassistant
    id: moonrise_time
    entity_id: sensor.template_weather_display_moonrise_next
  - platform: homeassistant
    id: forecasttoday
    entity_id: sensor.${bom_prefix}_short_text_0
        
  # Feels like temp from HACs custom sensor
  - platform: homeassistant
    id: fl
    entity_id: sensor.${bom_prefix}_temp_feels_like

  # preformated sunrise and sunset times from HA template sesnor
  - platform: homeassistant
    id: sunrise_next_text
    entity_id: sensor.weather_data
    attribute: sunrise_txt
  - platform: homeassistant
    id: sunset_next_text
    entity_id: sensor.weather_data
    attribute: sunset_txt
lvgl:
  
  # Page definitions - note that with LVGL page order in yaml is the same as compiled code
  pages:
    # Weather information sourced from Ecowitt and BOM
    - id: weather_page
      on_load:
        then: 
          lvgl.label.update:
            id: pagetitle
            text: "${town} Weather"
      bg_color: 0x000000
      # Swipe triggers for page navigation - duplicates same as buttons
      on_swipe_right:
        then:
          - script.execute: page_move_prev
      on_swipe_left:
        then:
          - script.execute: page_move_next  
      widgets:
    # Wind Rose
        # Canvas used for drawing wind history - behind all other objects on this page
        - canvas:
            id: wind_stick
            x: 50
            y: 140
            height: 180
            width: 180
        # Circle used for wind compass
        - arc:
            x: 50
            y: 140
            height: 180
            width: 180
            id: wind_rose
            arc_width: 2
            start_angle: 0
            end_angle: 360
            adjustable: false 
            arc_color: WHITE   
        # "Filled" arc used for pointer for wind compass
        - arc:
            id: dir_indicator
            x: 10
            y: 10
            start_angle: 0
            end_angle: 360
            arc_width: 6
            adjustable: false 
            height: 12
            width: 12
            arc_color: BLUE
        # Cardinal directions labels
        - label:
            x: 50
            y: 110
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "N"
        - label:
            x: 50
            y: 334
            text_font: calibri_19
            text_color: RED
            width: 180
            text_align: CENTER
            text:  "S"
        - label:
            x: 244
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "E" 
        - label:
            x: 21
            y: 221
            text_font: calibri_19
            text_color: RED
            text:  "W"      
        # Label for named wind direction       
        - label:
            id: dir_text
            x: 50
            y: 180
            text_font: calibri_25
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "-"
        # Units label which appers below wind speed
        - label:
            x: 50
            y: 250
            text_font: calibri_19
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "km/h"
        # Wind speed
        - label:
            id: speed_text
            x: 50
            y: 210
            text_font: calibri_40
            text_color: WHITE
            text_align: CENTER
            width: 180
            text: "-"

    # Observations
        # Icon for current day weather - top left of display
        - label:
            id: icon_today
            x: 20
            y: 45
            text_font: weather_36
            text_color: WHITE
            text: !lambda return id(icon0).state;
        # Current temperature from Ecowitt (not BOM)
        - label: 
            id: current_temp
            x: 87
            y: 46
            text_font: calibri_25
            text_color: WHITE
            text: !lambda return (id(temp).state + " °C").c_str();
        # BOM short "forecast" for today
        - label:
            id: short_today
            x: 87
            y: 73
            styles: forecast_text
            text_color: WHITE
            text: !lambda return id(forecasttoday).state;
            height: 25
            width: 135
        # Feels like icon and value
        - label: 
            id: feels_like_icon
            x: 235
            y: 40
            text_font: forecast_24
            text_color: WHITE
            text: "A"
        - label: 
            id: feels_like
            x: 270
            y: 49
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(fl).state + " °C").c_str();
        # Rain guage icon and total since midnight
        - label: 
            id: rain_total_icon
            x: 235
            y: 65
            text_font: forecast_24
            text_color: WHITE
            text: "B"
        - label: 
            id: rain_total
            x: 270
            y: 74
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(total_rain).state + " mm").c_str();
        # atmospheric pressure icon and value
        - label: 
            id: atmo_pressure_icon
            x: 235
            y: 90
            text_font: forecast_24
            text_color: WHITE
            text: "C"        
        - label: 
            id: atmo_pressure
            x: 270
            y: 99
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(pressure).state + " hPa").c_str();
        # Wind gust icon and value from Ecowitt
        - label: 
            id: wind_gust_icon
            x: 235
            y: 115
            text_font: forecast_24
            text_color: WHITE
            text: "D"        
        - label: 
            id: wind_gust
            x: 270
            y: 124
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return (id(gust).state + " km/h").c_str();
        # Next sunrise icon and value
        - label: 
            id: sunrise_icon
            x: 360
            y: 40
            text_font: forecast_24
            text_color: WHITE
            text: "F"
        - label: 
            id: sunrise
            x: 395
            y: 49
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return id(sunrise_next_text).state;
        # Next sunset icon and value
        - label: 
            id: sunset_icon
            x: 360
            y: 65
            text_font: forecast_24
            text_color: WHITE
            text: "E"
        - label: 
            id: sunset
            x: 395
            y: 74
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return id(sunset_next_text).state;
        # Humidity icon and value from Ecowitt
        - label: 
            id: humidity_icon
            x: 360
            y: 90
            text_font: forecast_24
            text_color: WHITE
            text: "G"        
        - label: 
            id: humidity
            x: 395
            y: 99
            text_font: calibri_17
            text_color: WHITE
            text: !lambda |-
                    char h[20];
                    snprintf(h, sizeof(h), "%.0f %%", id(bomhumidity).state);
                    return h;
        # Moon phase icon from HA sensor and value
        - label: 
            id: moon_phase_icon
            x: 360
            y: 115
            text_font: weather_24
            text_color: WHITE
            text: !lambda return id(moon_phase).state;
        - label: 
            id: moonrise
            x: 395
            y: 124
            text_font: calibri_17
            text_color: WHITE
            text: !lambda return id(moonrise_time).state;

    # temperature plot
        # Temperature graph showing BOM and Ecowitt temp plot for last 6 hours
        # Image sourced from HA using Puppet add-on
        - image: 
            id: templot_img
            x: 255
            y: 150
            src: templot

        - !include parts/hourly_strip.yaml
    # Forecast
        # 7 day forecast sourced from BOM
        # day 0 (today) uses full long forecast data (more than 255 chars) from 
        # BOM sensor attribute
        # The text labels sit inside fixed size boxes that clip them.  If the text is taller than its box,
        # script_forecast_scroll slowly slides the label up and down (the icons don't move).
        - obj:
            id: forecast_box_0
            x: 550
            y: 45
            width: 240
            height: 120
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: forecast_text_0
                  x: 0
                  y: 0
                  width: 240
                  height: SIZE_CONTENT
                  long_mode: WRAP
                  text_align: LEFT
                  text: !lambda return id(forecast0).state;
                  styles: forecast_text
                  text_color: WHITE
        - obj:
            id: forecast_box_1
            x: 550
            y: 185
            width: 240
            height: 40
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: forecast_text_1
                  x: 0
                  y: 0
                  width: 240
                  height: SIZE_CONTENT
                  long_mode: WRAP
                  text_align: LEFT
                  # short text in 7 day mode, long text in today/tomorrow mode
                  text: !lambda |-
                    // 7 day mode: short text.  3 block mode: the long text (already starts with the day and
                    // min/max), or the short text if the long text hasn't arrived
                    std::string s = id(forecast1).state;
                    if (id(forecast_mode) == 0) return s;
                    std::string ext = id(forecast1_long).state;
                    if (ext.size() < 20 || ext == "unknown" || ext == "unavailable") return s;
                    return ext;
                  styles: forecast_text
                  text_color: WHITE
        - obj:
            id: forecast_box_2
            x: 550
            y: 230
            width: 240
            height: 40
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: forecast_text_2
                  x: 0
                  y: 0
                  width: 240
                  height: SIZE_CONTENT
                  long_mode: WRAP
                  text_align: LEFT
                  # short text in 7 day mode, long text in the 3 block mode
                  text: !lambda |-
                    // 7 day mode: short text.  3 block mode: the long text (already starts with the day and
                    // min/max), or the short text if the long text hasn't arrived
                    std::string s = id(forecast2).state;
                    if (id(forecast_mode) == 0) return s;
                    std::string ext = id(forecast2_long).state;
                    if (ext.size() < 20 || ext == "unknown" || ext == "unavailable") return s;
                    return ext;
                  styles: forecast_text
                  text_color: WHITE
        - label:
            id: forecast_text_3
            x: 550
            y: 275
            height: 40
            width: 240
            long_mode: WRAP
            text_align: LEFT
            text: !lambda return id(forecast3).state;
            styles: forecast_text
            text_color: WHITE
        - label:
            id: forecast_text_4
            x: 550
            y: 320
            height: 40
            width: 240
            long_mode: WRAP
            text_align: LEFT
            text: !lambda return id(forecast4).state;
            styles: forecast_text
            text_color: WHITE
        - label:
            id: forecast_text_5
            x: 550
            y: 365
            height: 40
            width: 240
            long_mode: WRAP
            text_align: LEFT
            text: !lambda return id(forecast5).state;
            styles: forecast_text
            text_color: WHITE
        - label:
            id: forecast_text_6
            x: 550
            y: 410
            height: 40
            width: 240
            long_mode: WRAP
            text_align: LEFT
            text: !lambda return id(forecast6).state;
            styles: forecast_text
            text_color: WHITE
        # Forecast icons
        - label:
            id: forecast_icon_0
            x: 500
            y: 41
            height: 30
            width: 30
            text_align: LEFT
            text: !lambda return id(icon0).state;
            styles: forecast_glyph
            text_color: WHITE
        - label:
            id: forecast_icon_1
            x: 500
            y: 181
            height: 30
            width: 30
            text_align: LEFT
            text: !lambda return id(icon1).state;
            styles: forecast_glyph
            text_color: WHITE
        - label:
            id: forecast_icon_2
            x: 500
            y: 226
            height: 30
            width: 30
            text_align: LEFT
            text: !lambda return id(icon2).state;
            styles: forecast_glyph
            text_color: WHITE
        - label:
            id: forecast_icon_3
            x: 500
            y: 271
            height: 30
            width: 30
            text_align: LEFT
            text: !lambda return id(icon3).state;
            styles: forecast_glyph
            text_color: WHITE
        - label:
            id: forecast_icon_4
            x: 500
            y: 316
            height: 30
            width: 30
            text_align: LEFT
            text: !lambda return id(icon4).state;
            styles: forecast_glyph
            text_color: WHITE
        - label:
            id: forecast_icon_5
            x: 500
            y: 361
            height: 30
            width: 30
            text_align: LEFT
            text: !lambda return id(icon5).state;
            styles: forecast_glyph
            text_color: WHITE
        - label:
            id: forecast_icon_6
            x: 500
            y: 406
            height: 30
            width: 30
            text_align: LEFT
            text: !lambda return id(icon6).state;
            styles: forecast_glyph
            text_color: WHITE
        # borders for forecast data
        - line:
            id: fc_line_1
            points: 
              - 520, 176
              - 780, 176
            line_color: LIGHTBLUE
            line_width: 2
        - line:
            id: fc_line_2
            points: 
              - 520, 221
              - 780, 221
            line_color: LIGHTBLUE
            line_width: 2
        - line:
            id: fc_line_3
            points: 
              - 520, 266
              - 780, 266
            line_color: LIGHTBLUE
            line_width: 2
        - line:
            id: fc_line_4
            points: 
              - 520, 311
              - 780, 311
            line_color: LIGHTBLUE
            line_width: 2
        - line:
            id: fc_line_5
            points: 
              - 520, 356
              - 780, 356
            line_color: LIGHTBLUE
            line_width: 2
        - line:
            id: fc_line_6
            points: 
              - 520, 401
              - 780, 401
            line_color: LIGHTBLUE
            line_width: 2
        - line:
            points: 
              - 490, 35
              - 490, 445
            line_color: LIGHTBLUE
            line_width: 2
        # Invisible touch area over the forecast panel - double tap switches the forecast view
        - obj:
            id: forecast_touch
            x: 492
            y: 35
            width: 308
            height: 410
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            # LVGL's own double click timing is fussy, so time two short clicks ourselves: 700 ms window
            on_short_click:
              then:
                - lambda: |-
                    uint32_t now = millis();
                    if (id(forecast_last_tap) != 0 && (now - id(forecast_last_tap)) < 700) {
                      id(forecast_last_tap) = 0;
                      id(forecast_double_tap) = true;
                    } else {
                      id(forecast_last_tap) = now;
                      id(forecast_double_tap) = false;
                    }
                - if:
                    condition:
                      lambda: return id(forecast_double_tap);
                    then:
                      - script.execute: script_forecast_toggle
