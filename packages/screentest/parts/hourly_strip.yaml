# Hourly forecast strip for the weather page: one container holding the 24 hours (time, icon, temperature).
# Included from weather.yaml as a single widget, so it keeps its position (z-order) in the page.
# Hourly forecast
# Forcast data for 24 hours, in scrolling grid
obj:
    id: hourly_forecast
    x: 15
    y: 357
    width: 440
    height: 98
# LVGL 9.5 shows a vertical scrollbar here; the strip only needs to scroll sideways
    scroll_dir: HOR
    bg_color: BLACK
    border_width: 0
    layout:
      pad_column: 0
      pad_row: 0
      type: GRID
      grid_rows: [14, 37, 13]
      grid_columns: [45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45, 45] 
# Time, condition icon and temp sourced from BOM via template sensor
    widgets: 
      - label: 
          id: hour0_time
          grid_cell_row_pos: 0
          grid_cell_column_pos: 0
          text_color: WHITE
          grid_cell_x_align: CENTER
          text_align: CENTER
          text: !lambda return id(datetime_0).state;
          text_font: calibri_13
      - label: 
          id: hour0_icon
          grid_cell_row_pos: 1
          grid_cell_column_pos: 0
          text_color: WHITE
          grid_cell_x_align: CENTER
          text_align: CENTER
          text: !lambda return id(hour_icon0).state;
          text_font: weather_24
      - label: 
          id: hour0_temp
          grid_cell_row_pos: 2
          grid_cell_column_pos: 0
          text_color: WHITE
          grid_cell_x_align: CENTER
          text_align: CENTER
          text: !lambda |-
            char h[20];
            snprintf(h, sizeof(h), "%.0f °C", id(hourlytemp_0).state);
            return h;
          text_font: calibri_13

      - label: 
          id: hour1_time
          grid_cell_row_pos: 0
          grid_cell_column_pos: 1
          text_color: WHITE
          grid_cell_x_align: CENTER
