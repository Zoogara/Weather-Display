# Home Assistant template sensors used by the weather display.  Merge under template: in your config
# (it is a list of items, so paste it into / !include it from your existing template: section).
#   radar         - frame urls and timestamps; radar.yaml downloads the frames (replace YOUR_LAT/YOUR_LON)
#   forecast0-6   - 7 day text, long_text (forecast0-2) for the double-tap view
#   icons, moon, hourly times/icons, sunrise/sunset, and the 'Hourly Weather Data' trigger sensor
# Needs the BOM integration (sensor.rutherglen_*), weather.rutherglen_hourly, sensor.moon_phase, astroweather,
# your weather station sensors, and tools.jinja copied to /config/custom_templates/.  Rename entities to suit.

- sensor:
    - unique_id: named_wind_direction
      name: 'Wind Ordinal'
      availability: "{{ is_number(states('sensor.wind_direction')) }}"
      state: >-
          {%if states('sensor.wind_direction') | float(0)<=11 %}N
          {% elif states('sensor.wind_direction') | float(0)>348 %}N
          {% elif states('sensor.wind_direction') | float(0)<=34 | float>11 %}NNE
          {% elif states('sensor.wind_direction') | float(0)<=56 | float>34 %}NE
          {% elif states('sensor.wind_direction') | float(0)<=79 | float>56 %}ENE
          {% elif states('sensor.wind_direction') | float(0)<=101 | float>79 %}E
          {% elif states('sensor.wind_direction') | float(0)<=124 | float>101 %}ESE
          {% elif states('sensor.wind_direction') | float(0)<=146 | float>124 %}SE
          {% elif states('sensor.wind_direction') | float(0)<=169 | float>146 %}SSE
          {% elif states('sensor.wind_direction') | float(0)<=191 | float>169 %}S
          {% elif states('sensor.wind_direction') | float(0)<=214 | float>191 %}SSW
          {% elif states('sensor.wind_direction') | float(0)<=236 | float>214 %}SW
          {% elif states('sensor.wind_direction') | float(0)<=259 | float>236 %}WSW
          {% elif states('sensor.wind_direction') | float(0)<=281 | float>259 %}W
          {% elif states('sensor.wind_direction') | float(0)<=304 | float>281 %}WNW
          {% elif states('sensor.wind_direction') | float(0)<=326 | float>304 %}NW
          {% elif states('sensor.wind_direction') | float(0)<=348 | float>326 %}NNW
          {%- endif %}


