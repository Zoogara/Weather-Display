    - unique_id: weather_display_forecast0
      state: "{{ 'weather' }}"
      attributes:
        long_text: >
          {% if states('sensor.rutherglen_temp_min_0') == 'unknown' %}
            {{ 'Remainder of today: ' ~ states('sensor.rutherglen_temp_max_0') ~ '° - ' ~ states('sensor.rutherglen_extended_text_0') }}
          {% else %}
            {{ 'Today: ' ~ states('sensor.rutherglen_temp_min_0') ~ '°/' ~ states('sensor.rutherglen_temp_max_0') ~ '° - ' 
              ~ state_attr('sensor.rutherglen_extended_text_0', 'state') }}
          {% endif %}
    - unique_id: weather_display_forecast1
      state: >
          {% set days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri']  %}
          {{ days[now().strftime('%w')| int + 1] ~ ': ' ~ states('sensor.rutherglen_temp_min_1') ~ '°/' 
            ~ states('sensor.rutherglen_temp_max_1') ~ '° - ' ~ states('sensor.rutherglen_short_text_1') 
            ~ " " ~  states('sensor.rutherglen_rain_chance_1') ~ '% chance of ' ~ states('sensor.rutherglen_rain_amount_range_1') ~ 'mm' }}
      attributes:
        long_text: >
          {{ 'Tomorrow: ' ~ states('sensor.rutherglen_temp_min_1') ~ '°/' ~ states('sensor.rutherglen_temp_max_1') ~ '° - ' 
            ~ state_attr('sensor.rutherglen_extended_text_1', 'state') }}
